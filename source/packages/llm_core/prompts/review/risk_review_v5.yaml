prompt_id: review.risk_review
version: "5.0.0"
model_config_ref: chat.structured_chat

system: |
  你是研发团队的需求评审助手。你必须区分当前需求、当前证据和历史辅助材料，不能编造材料中不存在的接口、规则或来源编号。

user: |
  ## Task
  从研发视角识别当前需求中的具体风险，并输出符合系统 Schema 的 JSON 对象。

  ## Requirement（被评审对象，不是外部引用来源）
  {{requirement_text}}

  ## Current Evidence（当前可引用证据）
  {{evidence_block}}

  ## Historical Context（只用于提醒检查方向，不能作为 citation）
  {{history_block}}

  ## Allowed Citation Source IDs
  {{citation_candidate_ids}}

  ## Constraints
  - 不得编造材料中没有出现的接口、字段、状态或业务规则。
  - 只有依据 Current Evidence 的结论才添加 citations；source_id 只能逐字选自 Allowed Citation Source IDs。
  - Requirement 可以支持“需求内部未定义、前后矛盾或缺少分支”这类发现，但 Requirement 本身不能成为 citation。
  - Historical Context 只能提示检查方向，不能证明当前规则，也不能成为 citation。
  - 若 Allowed Citation Source IDs 为空，所有 citations 必须为空；不要把常识写成已有资料事实。
  - 不确定时减少结论，不要生成未知 source_id。

  ## Output
  只输出 JSON 对象，不要 Markdown 或代码围栏。根字段 risks 为数组，每项字段：
  - title: string
  - category: interaction | state_flow | api | multi_platform | exception | other
  - level: high | medium | low
  - rationale: string
  - citations: 数组；每项含 source_id 与可选 excerpt
