<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Lexical Retrieval：按同一词法规则找候选</title>
  <desc id="desc">Chunk 和 Query 使用同一词法配置形成倒排索引与查询词项，先确定候选范围，再用词面相关度排序；BM25 与 PostgreSQL ts_rank 是相近但不同的算法。</desc>
  <defs>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1557B0"/></marker>
    <marker id="arrow-data" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#0F7C83"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102A56}.muted{fill:#536986}.title{font-size:44px;font-weight:750;letter-spacing:-.6px}.claim{font-size:21px;font-weight:450}.band-title{font-size:22px;font-weight:700}.card-title{font-size:24px;font-weight:700}.card-copy{font-size:17px;font-weight:450}.small{font-size:16px;font-weight:550}.chip{font-size:16px;font-weight:700}.takeaway{font-size:24px;font-weight:700}.card{fill:#fff;stroke:#AFC3E3;stroke-width:2}.data{fill:#F2FAFA;stroke:#0F7C83;stroke-width:2.5}.primary{fill:#F5F8FD;stroke:#1557B0;stroke-width:2.5}.output{fill:#F4FAF6;stroke:#2C7A53;stroke-width:2.5}.arrow{fill:none;stroke:#1557B0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-primary)}.data-arrow{fill:none;stroke:#0F7C83;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-data)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text x="64" y="76" class="sans ink title">Lexical Retrieval：按同一词法规则找候选</text>
  <text x="64" y="119" class="sans muted claim">精确字段、接口名和版本号依赖词面命中；资料与 Query 必须共享分词、规范化和查询语义。</text>
  <rect x="1328" y="48" width="208" height="48" rx="24" fill="#EAF1FC" stroke="#AFC3E3" stroke-width="1.5"/>
  <text x="1432" y="79" text-anchor="middle" class="sans ink chip">第 11 节 · 词法检索</text>

  <rect x="64" y="158" width="1472" height="610" rx="24" fill="#fff" stroke="#86A9D9" stroke-width="2.5"/>
  <text x="96" y="202" class="sans band-title" fill="#1557B0">建索引与查询必须使用同一套词法配置</text>

  <rect x="96" y="238" width="262" height="154" rx="16" class="card"/>
  <text x="227" y="279" text-anchor="middle" class="sans ink card-title">Chunk 文本</text>
  <text x="227" y="317" text-anchor="middle" class="sans muted card-copy">“接口 v2 必须提供</text>
  <text x="227" y="345" text-anchor="middle" class="sans muted card-copy">source_channel”</text>
  <rect x="96" y="442" width="262" height="136" rx="16" class="card"/>
  <text x="227" y="483" text-anchor="middle" class="sans ink card-title">本轮 Query</text>
  <text x="227" y="523" text-anchor="middle" class="sans muted card-copy">“v2 source_channel”</text>
  <text x="227" y="553" text-anchor="middle" class="sans small" fill="#1557B0">OR / AND 改变范围</text>

  <path d="M358 315H408" class="data-arrow"/>
  <path d="M358 510H408" class="arrow"/>

  <rect x="418" y="264" width="282" height="270" rx="18" class="data"/>
  <text x="559" y="306" text-anchor="middle" class="sans ink card-title">共享词法处理</text>
  <text x="559" y="349" text-anchor="middle" class="sans muted card-copy">规范化 · 分词</text>
  <text x="559" y="381" text-anchor="middle" class="sans muted card-copy">停用词 · 词形规则</text>
  <line x1="454" y1="410" x2="664" y2="410" stroke="#B9DADB" stroke-width="1.5"/>
  <rect x="458" y="438" width="202" height="58" rx="12" fill="#fff" stroke="#0F7C83" stroke-width="1.5"/>
  <text x="559" y="474" text-anchor="middle" class="sans small" fill="#0F7C83">v2 · source_channel</text>

  <path d="M700 399H750" class="data-arrow"/>

  <rect x="760" y="224" width="314" height="350" rx="18" class="primary"/>
  <text x="917" y="266" text-anchor="middle" class="sans ink card-title">倒排索引与候选范围</text>
  <rect x="790" y="296" width="254" height="64" rx="12" fill="#fff" stroke="#1557B0" stroke-width="1.5"/>
  <text x="814" y="324" class="sans ink card-copy">v2</text>
  <text x="1020" y="347" text-anchor="end" class="sans small muted">→ Chunk A, C</text>
  <rect x="790" y="376" width="254" height="64" rx="12" fill="#fff" stroke="#1557B0" stroke-width="1.5"/>
  <text x="814" y="404" class="sans ink card-copy">source_channel</text>
  <text x="1020" y="427" text-anchor="end" class="sans small muted">→ Chunk A</text>
  <text x="917" y="486" text-anchor="middle" class="sans small" fill="#1557B0">先判断“哪些 Chunk 命中”</text>
  <text x="917" y="519" text-anchor="middle" class="sans small" fill="#C76B00">词面不同可能完全不召回</text>

  <path d="M1074 399H1124" class="arrow"/>

  <rect x="1134" y="224" width="370" height="350" rx="18" class="output"/>
  <text x="1319" y="266" text-anchor="middle" class="sans ink card-title">词面相关度排序</text>
  <rect x="1164" y="300" width="310" height="76" rx="12" fill="#fff" stroke="#2C7A53" stroke-width="1.5"/>
  <text x="1188" y="331" class="sans ink card-copy">1　Chunk A</text>
  <text x="1450" y="358" text-anchor="end" class="sans small" fill="#2C7A53">ts_rank 0.74</text>
  <rect x="1164" y="392" width="310" height="76" rx="12" fill="#fff" stroke="#AFC3E3" stroke-width="1.5"/>
  <text x="1188" y="423" class="sans ink card-copy">2　Chunk C</text>
  <text x="1450" y="450" text-anchor="end" class="sans small muted">ts_rank 0.21</text>
  <text x="1319" y="508" text-anchor="middle" class="sans small" fill="#2C7A53">保留原始分数与 route rank</text>
  <text x="1319" y="541" text-anchor="middle" class="sans small" fill="#C76B00">ts_rank 不是 BM25</text>

  <rect x="96" y="618" width="1408" height="108" rx="16" fill="#F2FAFA" stroke="#B9DADB" stroke-width="1.5"/>
  <text x="124" y="657" class="sans band-title" fill="#0F7C83">适合命中的信号</text>
  <text x="124" y="694" class="sans muted card-copy">精确标识、字段名、版本号与重复术语；同义改写、隐含关系和语义邻近需要 Dense Retrieval 补充。</text>

  <rect x="64" y="792" width="1472" height="76" rx="18" fill="#FFF8EE" stroke="#E1B370" stroke-width="1.8"/>
  <circle cx="104" cy="830" r="20" fill="#C76B00"/>
  <text x="104" y="838" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#fff">!</text>
  <text x="144" y="838" class="sans ink takeaway">词法检索先按词确定候选，再对候选排序；Query 语义和索引词法不一致，会在第一步就漏掉内容。</text>
</svg>
