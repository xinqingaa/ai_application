<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Context 装配：候选怎样成为本轮 Evidence</title>
  <desc id="desc">Retriever 候选先保留身份和原文位置，再经过证据资格、去重排序与分区预算，装入 BuiltContext；只有最终进入 Current Evidence 的来源才能进入本轮允许声明集合。</desc>
  <defs>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1557B0"/></marker>
    <marker id="arrow-data" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#0F7C83"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102A56}.muted{fill:#536986}.title{font-size:44px;font-weight:750;letter-spacing:-.6px}.claim{font-size:21px;font-weight:450}.band-title{font-size:22px;font-weight:700}.card-title{font-size:23px;font-weight:700}.card-copy{font-size:16px;font-weight:450}.small{font-size:15px;font-weight:550}.chip{font-size:16px;font-weight:700}.takeaway{font-size:24px;font-weight:700}.card{fill:#fff;stroke:#AFC3E3;stroke-width:2}.data{fill:#F2FAFA;stroke:#0F7C83;stroke-width:2.5}.primary{fill:#F5F8FD;stroke:#1557B0;stroke-width:2.5}.output{fill:#F4FAF6;stroke:#2C7A53;stroke-width:2.5}.caution{fill:#FFF8EE;stroke:#C76B00;stroke-width:2}.arrow{fill:none;stroke:#1557B0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-primary)}.data-arrow{fill:none;stroke:#0F7C83;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-data)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text x="64" y="76" class="sans ink title">Context 装配：候选怎样成为本轮 Evidence</text>
  <text x="64" y="119" class="sans muted claim">检索只交出候选名单；应用还要沿身份、资格、去重与预算，把它们装进本轮受控 Context。</text>
  <rect x="1328" y="48" width="208" height="48" rx="24" fill="#EAF1FC" stroke="#AFC3E3" stroke-width="1.5"/>
  <text x="1432" y="79" text-anchor="middle" class="sans ink chip">第 15 节 · Context</text>

  <rect x="64" y="158" width="1472" height="610" rx="24" fill="#fff" stroke="#86A9D9" stroke-width="2.5"/>
  <text x="96" y="202" class="sans band-title" fill="#1557B0">同一组 A、B 走完装配链</text>

  <rect x="96" y="234" width="224" height="310" rx="18" class="card"/>
  <text x="208" y="275" text-anchor="middle" class="sans ink card-title">Retriever 名单</text>
  <rect x="124" y="304" width="168" height="88" rx="12" class="data"/>
  <text x="208" y="336" text-anchor="middle" class="sans ink card-copy">A｜订单状态规则</text>
  <text x="208" y="367" text-anchor="middle" class="sans small" fill="#0F7C83">rank #1</text>
  <rect x="124" y="410" width="168" height="88" rx="12" class="data"/>
  <text x="208" y="442" text-anchor="middle" class="sans ink card-copy">B｜接口约束</text>
  <text x="208" y="473" text-anchor="middle" class="sans small" fill="#0F7C83">rank #2</text>
  <text x="208" y="524" text-anchor="middle" class="sans small muted">此时模型还没看到</text>

  <path d="M320 389H358" class="arrow"/>
  <rect x="368" y="234" width="230" height="310" rx="18" class="primary"/>
  <text x="483" y="275" text-anchor="middle" class="sans ink card-title">原样映射</text>
  <text x="483" y="318" text-anchor="middle" class="sans muted card-copy">保持 chunk_id</text>
  <text x="483" y="350" text-anchor="middle" class="sans muted card-copy">带回 SourceSpan</text>
  <text x="483" y="382" text-anchor="middle" class="sans muted card-copy">构造 ContextSource</text>
  <line x1="400" y1="410" x2="566" y2="410" stroke="#C4D4EA"/>
  <text x="483" y="447" text-anchor="middle" class="sans small" fill="#C76B00">缺少原文位置 → 失败</text>
  <text x="483" y="479" text-anchor="middle" class="sans small" fill="#C76B00">身份冲突 → 失败</text>

  <path d="M598 389H636" class="arrow"/>
  <rect x="646" y="234" width="230" height="310" rx="18" class="data"/>
  <text x="761" y="275" text-anchor="middle" class="sans ink card-title">资格与顺序</text>
  <text x="761" y="318" text-anchor="middle" class="sans muted card-copy">Current Evidence</text>
  <text x="761" y="350" text-anchor="middle" class="sans muted card-copy">History / 不可引用</text>
  <text x="761" y="382" text-anchor="middle" class="sans muted card-copy">去重并保留稳定顺序</text>
  <line x1="678" y1="410" x2="844" y2="410" stroke="#B9DADB"/>
  <text x="761" y="447" text-anchor="middle" class="sans small" fill="#0F7C83">A、B 都具备当前证据资格</text>
  <text x="761" y="479" text-anchor="middle" class="sans small" fill="#C76B00">排序靠前不等于更权威</text>

  <path d="M876 389H914" class="data-arrow"/>
  <rect x="924" y="214" width="252" height="350" rx="18" class="caution"/>
  <text x="1050" y="255" text-anchor="middle" class="sans ink card-title">按更紧的预算装入</text>
  <text x="1050" y="295" text-anchor="middle" class="sans muted card-copy">总预算</text>
  <text x="1050" y="324" text-anchor="middle" class="sans small muted">与 Evidence 分区预算</text>
  <rect x="954" y="352" width="192" height="70" rx="12" fill="#fff" stroke="#2C7A53" stroke-width="1.5"/>
  <text x="1050" y="382" text-anchor="middle" class="sans ink card-copy">A｜完整装入</text>
  <text x="1050" y="408" text-anchor="middle" class="sans small" fill="#2C7A53">进入 Evidence</text>
  <rect x="954" y="438" width="192" height="70" rx="12" fill="#fff" stroke="#C76B00" stroke-width="1.5"/>
  <text x="1050" y="468" text-anchor="middle" class="sans ink card-copy">B｜明确丢弃</text>
  <text x="1050" y="494" text-anchor="middle" class="sans small" fill="#C76B00">Evidence 格子不足</text>
  <text x="1050" y="540" text-anchor="middle" class="sans small muted">本地 token 尺只负责装货</text>

  <path d="M1176 389H1214" class="arrow"/>
  <rect x="1224" y="214" width="280" height="350" rx="18" class="output"/>
  <text x="1364" y="255" text-anchor="middle" class="sans ink card-title">BuiltContext</text>
  <rect x="1254" y="286" width="220" height="72" rx="12" fill="#fff" stroke="#AFC3E3"/>
  <text x="1364" y="316" text-anchor="middle" class="sans ink card-copy">Requirement｜完整保留</text>
  <text x="1364" y="343" text-anchor="middle" class="sans small muted">被评审对象，不可自证</text>
  <rect x="1254" y="374" width="220" height="80" rx="12" fill="#fff" stroke="#2C7A53" stroke-width="1.5"/>
  <text x="1364" y="406" text-anchor="middle" class="sans ink card-copy">Current Evidence｜A</text>
  <text x="1364" y="435" text-anchor="middle" class="sans small" fill="#2C7A53">模型本轮真正看到</text>
  <rect x="1254" y="470" width="220" height="62" rx="12" fill="#F2FAFA" stroke="#0F7C83"/>
  <text x="1364" y="497" text-anchor="middle" class="sans ink card-copy">允许声明集合</text>
  <text x="1364" y="521" text-anchor="middle" class="sans small" fill="#0F7C83">[A.chunk_id]</text>

  <rect x="96" y="594" width="1408" height="132" rx="16" fill="#F2FAFA" stroke="#B9DADB" stroke-width="1.5"/>
  <text x="124" y="633" class="sans band-title" fill="#0F7C83">ContextBuildReport</text>
  <text x="124" y="670" class="sans muted card-copy">逐条记录 mapped、included、compressed、dropped 与原因；检索报告解释名单，装配报告解释模型最终看见什么。</text>
  <text x="124" y="701" class="sans small" fill="#C76B00">Prompt 规定“怎样做”，Context 决定“拿什么做”；增大总预算不能修复 Evidence 分区不足或身份错误。</text>

  <rect x="64" y="792" width="1472" height="76" rx="18" fill="#FFF8EE" stroke="#E1B370" stroke-width="1.8"/>
  <circle cx="104" cy="830" r="20" fill="#C76B00"/>
  <text x="104" y="838" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#fff">!</text>
  <text x="144" y="838" class="sans ink takeaway">只有最终装入 Current Evidence 的来源才能被声明；被检索到、排在前面或仍有总预算都不够。</text>
</svg>
