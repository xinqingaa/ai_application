<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Citation 支持性：先找到原话，再判断能否证明</title>
  <desc id="desc">来源编号通过允许集合检查后，应用先在对应来源中定位逐字引文。找不到或位置不唯一时停止；唯一定位后才判断来源是支持、反驳、无关还是无法判断。只有支持成立才形成经过支持性校验的 Citation。</desc>
  <defs>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1557B0"/></marker>
    <marker id="arrow-data" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#0F7C83"/></marker>
    <marker id="arrow-failure" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#C43D3D"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102A56}.muted{fill:#536986}.title{font-size:44px;font-weight:750;letter-spacing:-.6px}.claim{font-size:21px;font-weight:450}.band-title{font-size:22px;font-weight:700}.card-title{font-size:22px;font-weight:700}.card-copy{font-size:16px;font-weight:450}.small{font-size:15px;font-weight:550}.chip{font-size:16px;font-weight:700}.takeaway{font-size:24px;font-weight:700}.card{fill:#fff;stroke:#AFC3E3;stroke-width:2}.data{fill:#F2FAFA;stroke:#0F7C83;stroke-width:2.5}.model{fill:#F5F3FF;stroke:#5B45C6;stroke-width:2.5}.output{fill:#F4FAF6;stroke:#2C7A53;stroke-width:2.5}.failure{fill:#FFF1F1;stroke:#C43D3D;stroke-width:2}.caution{fill:#FFF8EE;stroke:#C76B00;stroke-width:2}.arrow{fill:none;stroke:#1557B0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-primary)}.data-arrow{fill:none;stroke:#0F7C83;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-data)}.failure-arrow{fill:none;stroke:#C43D3D;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-failure)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text x="64" y="76" class="sans ink title">Citation 支持性：先找到原话，再判断能否证明</text>
  <text x="64" y="119" class="sans muted claim">合法来源 ID 只告诉应用去哪核对；逐字引文和完整语境共同决定它是否支持当前说法。</text>
  <rect x="1310" y="48" width="226" height="48" rx="24" fill="#EAF1FC" stroke="#AFC3E3" stroke-width="1.5"/>
  <text x="1423" y="79" text-anchor="middle" class="sans ink chip">第 17 节 · Citation 支持性</text>

  <rect x="64" y="158" width="1472" height="610" rx="24" fill="#fff" stroke="#86A9D9" stroke-width="2.5"/>
  <text x="96" y="202" class="sans band-title" fill="#1557B0">同一条来源声明依次通过两段校验</text>

  <rect x="96" y="250" width="244" height="220" rx="18" class="data"/>
  <text x="218" y="291" text-anchor="middle" class="sans ink card-title">来源编号已通过</text>
  <text x="218" y="331" text-anchor="middle" class="sans muted card-copy">属于本轮允许集合</text>
  <rect x="128" y="359" width="180" height="54" rx="12" fill="#fff" stroke="#0F7C83"/>
  <text x="218" y="393" text-anchor="middle" class="sans small" fill="#0F7C83">B.chunk_id · candidate</text>
  <text x="218" y="444" text-anchor="middle" class="sans small muted">只确定去哪里核对</text>

  <path d="M340 360H392" class="data-arrow"/>
  <rect x="402" y="230" width="286" height="260" rx="18" class="card"/>
  <text x="545" y="271" text-anchor="middle" class="sans ink card-title">定位模型给出的原话</text>
  <text x="545" y="312" text-anchor="middle" class="sans muted card-copy">只处理 Unicode、换行与空白</text>
  <text x="545" y="344" text-anchor="middle" class="sans muted card-copy">不做同义改写或相似搜索</text>
  <rect x="438" y="374" width="214" height="62" rx="12" fill="#F2FAFA" stroke="#0F7C83"/>
  <text x="545" y="400" text-anchor="middle" class="sans small" fill="#0F7C83">唯一找到</text>
  <text x="545" y="425" text-anchor="middle" class="sans small muted">保存原文位置与字符范围</text>
  <text x="545" y="468" text-anchor="middle" class="sans small" fill="#C76B00">文字存在仍不等于支持</text>

  <path d="M688 360H750" class="arrow"/>
  <rect x="760" y="210" width="330" height="300" rx="18" class="model"/>
  <text x="925" y="251" text-anchor="middle" class="sans ink card-title">读取完整语境判断关系</text>
  <text x="925" y="291" text-anchor="middle" class="sans muted card-copy">具体说法 + 逐字引文 + 来源全文</text>
  <text x="925" y="323" text-anchor="middle" class="sans muted card-copy">同时检查版本、范围、条件与否定</text>
  <rect x="792" y="354" width="133" height="52" rx="12" fill="#fff" stroke="#2C7A53"/>
  <text x="858" y="387" text-anchor="middle" class="sans small" fill="#2C7A53">支持</text>
  <rect x="941" y="354" width="117" height="52" rx="12" fill="#fff" stroke="#C43D3D"/>
  <text x="999" y="387" text-anchor="middle" class="sans small" fill="#C43D3D">反驳</text>
  <rect x="792" y="422" width="133" height="52" rx="12" fill="#fff" stroke="#C76B00"/>
  <text x="858" y="455" text-anchor="middle" class="sans small" fill="#C76B00">无关</text>
  <rect x="941" y="422" width="117" height="52" rx="12" fill="#fff" stroke="#C76B00"/>
  <text x="999" y="455" text-anchor="middle" class="sans small" fill="#C76B00">无法判断</text>

  <path d="M1090 360H1198" class="data-arrow"/>
  <text x="1144" y="344" text-anchor="middle" class="sans small" fill="#2C7A53">只有“支持”</text>
  <rect x="1208" y="250" width="296" height="220" rx="18" class="output"/>
  <text x="1356" y="291" text-anchor="middle" class="sans ink card-title">经过支持性校验</text>
  <text x="1356" y="331" text-anchor="middle" class="sans muted card-copy">来源身份 · 逐字引文</text>
  <text x="1356" y="363" text-anchor="middle" class="sans muted card-copy">原文位置 · 支持理由</text>
  <line x1="1244" y1="392" x2="1468" y2="392" stroke="#B9DCC8"/>
  <text x="1356" y="425" text-anchor="middle" class="sans small" fill="#2C7A53">可以交给下一层判断充分性</text>

  <path d="M545 490V546H360V576" class="failure-arrow"/>
  <text x="446" y="536" text-anchor="middle" class="sans small" fill="#C43D3D">找不到或位置不唯一</text>
  <rect x="176" y="586" width="368" height="132" rx="16" class="failure"/>
  <text x="360" y="626" text-anchor="middle" class="sans ink card-title">停在定位结果</text>
  <text x="360" y="664" text-anchor="middle" class="sans muted card-copy">保留原始引文，不让模型猜原话</text>
  <text x="360" y="696" text-anchor="middle" class="sans small" fill="#C43D3D">不形成已验证 Citation</text>

  <path d="M925 510V576" class="arrow"/>
  <text x="986" y="551" class="sans small muted">反驳 / 无关 / 无法判断</text>
  <rect x="650" y="586" width="550" height="132" rx="16" class="caution"/>
  <text x="925" y="626" text-anchor="middle" class="sans ink card-title">保留关系与理由，但不接受为支持</text>
  <text x="925" y="664" text-anchor="middle" class="sans muted card-copy">三种结果含义不同；校验器失败也不能伪装成“无法判断”</text>
  <text x="925" y="696" text-anchor="middle" class="sans small" fill="#C76B00">后续机制据此解释缺口，而不是把它们压成 false</text>

  <rect x="64" y="792" width="1472" height="76" rx="18" fill="#FFF8EE" stroke="#E1B370" stroke-width="1.8"/>
  <circle cx="104" cy="830" r="20" fill="#C76B00"/>
  <text x="104" y="838" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#fff">!</text>
  <text x="144" y="838" class="sans ink takeaway">编号合法、引文存在、内容支持、证据充分是四层结论；本节只完成中间两层。</text>
</svg>
