<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">可信生成：结构合法之后，还要检查来源集合</title>
  <desc id="desc">BuiltContext 和本轮允许来源进入 Prompt，模型生成结构化风险后，应用先做 JSON 与 Schema 解析，再逐条检查 claimed source_id 是否属于允许集合，并明确区分成功、结构失败与未知来源。</desc>
  <defs>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1557B0"/></marker>
    <marker id="arrow-data" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#0F7C83"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102A56}.muted{fill:#536986}.title{font-size:44px;font-weight:750;letter-spacing:-.6px}.claim{font-size:21px;font-weight:450}.band-title{font-size:22px;font-weight:700}.card-title{font-size:22px;font-weight:700}.card-copy{font-size:16px;font-weight:450}.small{font-size:15px;font-weight:550}.chip{font-size:16px;font-weight:700}.takeaway{font-size:24px;font-weight:700}.card{fill:#fff;stroke:#AFC3E3;stroke-width:2}.data{fill:#F2FAFA;stroke:#0F7C83;stroke-width:2.5}.model{fill:#F5F3FF;stroke:#5B45C6;stroke-width:2.5}.output{fill:#F4FAF6;stroke:#2C7A53;stroke-width:2.5}.failure{fill:#FFF1F1;stroke:#C43D3D;stroke-width:2}.caution{fill:#FFF8EE;stroke:#C76B00;stroke-width:2}.arrow{fill:none;stroke:#1557B0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-primary)}.data-arrow{fill:none;stroke:#0F7C83;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-data)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text x="64" y="76" class="sans ink title">可信生成：结构合法之后，还要检查来源集合</text>
  <text x="64" y="119" class="sans muted claim">模型写出的 source_id 仍是概率性字符串；应用必须把固定 Schema 与本轮动态 allowlist 分开检查。</text>
  <rect x="1328" y="48" width="208" height="48" rx="24" fill="#EAF1FC" stroke="#AFC3E3" stroke-width="1.5"/>
  <text x="1432" y="79" text-anchor="middle" class="sans ink chip">第 16 节 · 可信生成</text>

  <rect x="64" y="158" width="1472" height="610" rx="24" fill="#fff" stroke="#86A9D9" stroke-width="2.5"/>
  <text x="96" y="202" class="sans band-title" fill="#1557B0">固定生成与本地校验链</text>

  <rect x="96" y="238" width="230" height="196" rx="16" class="data"/>
  <text x="211" y="278" text-anchor="middle" class="sans ink card-title">BuiltContext</text>
  <text x="211" y="317" text-anchor="middle" class="sans muted card-copy">Requirement + Evidence</text>
  <text x="211" y="349" text-anchor="middle" class="sans muted card-copy">允许来源 [A, B]</text>
  <line x1="126" y1="374" x2="296" y2="374" stroke="#B9DADB"/>
  <text x="211" y="405" text-anchor="middle" class="sans small" fill="#0F7C83">生成阶段不重新检索</text>

  <path d="M326 336H368" class="data-arrow"/>
  <rect x="378" y="238" width="230" height="196" rx="16" class="card"/>
  <text x="493" y="278" text-anchor="middle" class="sans ink card-title">Prompt 约束</text>
  <text x="493" y="317" text-anchor="middle" class="sans muted card-copy">显式列出允许 ID</text>
  <text x="493" y="349" text-anchor="middle" class="sans muted card-copy">要求结构化风险</text>
  <line x1="408" y1="374" x2="578" y2="374" stroke="#D6E0EF"/>
  <text x="493" y="405" text-anchor="middle" class="sans small" fill="#C76B00">协议，不是权限检查</text>

  <path d="M608 336H650" class="arrow"/>
  <rect x="660" y="238" width="230" height="196" rx="16" class="model"/>
  <text x="775" y="278" text-anchor="middle" class="sans ink card-title">真实模型生成</text>
  <text x="775" y="317" text-anchor="middle" class="sans muted card-copy">risks[] + citations[]</text>
  <text x="775" y="349" text-anchor="middle" class="sans muted card-copy">claimed source_id</text>
  <line x1="690" y1="374" x2="860" y2="374" stroke="#D7D0FA"/>
  <text x="775" y="405" text-anchor="middle" class="sans small" fill="#5B45C6">此时仍是候选输出</text>

  <path d="M890 336H932" class="arrow"/>
  <rect x="942" y="238" width="230" height="196" rx="16" class="card"/>
  <text x="1057" y="278" text-anchor="middle" class="sans ink card-title">JSON / Schema</text>
  <text x="1057" y="317" text-anchor="middle" class="sans muted card-copy">解析固定业务形状</text>
  <text x="1057" y="349" text-anchor="middle" class="sans muted card-copy">字段 · 类型 · 枚举</text>
  <line x1="972" y1="374" x2="1142" y2="374" stroke="#D6E0EF"/>
  <text x="1057" y="405" text-anchor="middle" class="sans small" fill="#C76B00">失败 → 结构输出无效</text>

  <path d="M1172 336H1214" class="arrow"/>
  <rect x="1224" y="218" width="280" height="236" rx="18" class="output"/>
  <text x="1364" y="259" text-anchor="middle" class="sans ink card-title">来源集合成员检查</text>
  <text x="1364" y="300" text-anchor="middle" class="sans muted card-copy">逐条比较 claimed source_id</text>
  <rect x="1256" y="326" width="216" height="58" rx="12" fill="#fff" stroke="#2C7A53"/>
  <text x="1364" y="362" text-anchor="middle" class="sans small" fill="#2C7A53">A ∈ [A, B] → candidate</text>
  <rect x="1256" y="394" width="216" height="42" rx="12" fill="#fff" stroke="#C43D3D"/>
  <text x="1364" y="421" text-anchor="middle" class="sans small" fill="#C43D3D">X ∉ [A, B] → unknown</text>

  <path d="M1057 434V470H520V534" class="arrow"/>
  <text x="790" y="460" text-anchor="middle" class="sans small" fill="#C43D3D">parse failed</text>
  <path d="M1224 415H1188V506H801V534" class="arrow"/>
  <text x="996" y="496" text-anchor="middle" class="sans small muted">存在 unknown</text>
  <path d="M1364 454V534" class="data-arrow"/>
  <text x="1430" y="500" text-anchor="middle" class="sans small" fill="#2C7A53">全部已知</text>

  <rect x="96" y="544" width="398" height="158" rx="16" class="failure"/>
  <text x="295" y="585" text-anchor="middle" class="sans ink card-title">structured_output_invalid</text>
  <text x="295" y="624" text-anchor="middle" class="sans muted card-copy">empty / JSON / Schema 失败</text>
  <text x="295" y="661" text-anchor="middle" class="sans small" fill="#C43D3D">原始字符串不能进入业务结果</text>

  <rect x="602" y="544" width="398" height="158" rx="16" class="caution"/>
  <text x="801" y="585" text-anchor="middle" class="sans ink card-title">unknown_citation_source</text>
  <text x="801" y="624" text-anchor="middle" class="sans muted card-copy">至少一个声明不在 allowlist</text>
  <text x="801" y="661" text-anchor="middle" class="sans small" fill="#C76B00">保留原始 ID，不按标题自动修复</text>

  <rect x="1106" y="544" width="398" height="158" rx="16" class="output"/>
  <text x="1305" y="585" text-anchor="middle" class="sans ink card-title">succeeded</text>
  <text x="1305" y="624" text-anchor="middle" class="sans muted card-copy">结构合法且已声明 ID 未越界</text>
  <text x="1305" y="661" text-anchor="middle" class="sans small" fill="#2C7A53">仅完成 candidate membership</text>

  <rect x="64" y="792" width="1472" height="76" rx="18" fill="#FFF8EE" stroke="#E1B370" stroke-width="1.8"/>
  <circle cx="104" cy="830" r="20" fill="#C76B00"/>
  <text x="104" y="838" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#fff">!</text>
  <text x="144" y="838" class="sans ink takeaway">succeeded 只证明结构合法且来源编号未越界；它不证明引用内容支持风险，也不代表证据充分。</text>
</svg>
