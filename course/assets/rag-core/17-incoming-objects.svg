<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">第 14–16 节：每节交付什么，还欠缺什么</title>
  <desc id="desc">第 14 节交付最终检索名单与诊断，还欠缺本轮 Context。第 15 节交付本轮 Context 与允许集合，还欠缺模型结论与编号检查。第 16 节交付结构化风险与成员检查，还欠缺引文是否存在、内容是否支持。</desc>

  <defs>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#1557B0"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .ink { fill: #102A56; }
      .muted { fill: #536986; }
      .title { font-size: 42px; font-weight: 750; letter-spacing: -0.6px; }
      .claim { font-size: 21px; font-weight: 450; }
      .band-title { font-size: 22px; font-weight: 700; }
      .card-title { font-size: 24px; font-weight: 700; }
      .card-copy { font-size: 16px; font-weight: 450; }
      .small { font-size: 15px; font-weight: 550; }
      .chip { font-size: 16px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 700; }
      .takeaway { font-size: 22px; font-weight: 700; }
      .card { fill: #FFFFFF; stroke: #AFC3E3; stroke-width: 2; }
      .data { fill: #F2FAFA; stroke: #0F7C83; stroke-width: 2.5; }
      .model { fill: #F5F3FF; stroke: #5B45C6; stroke-width: 2.5; }
      .arrow { fill: none; stroke: #1557B0; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-primary); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F7F9FC"/>

  <text x="64" y="72" class="sans ink title">第 14–16 节：每节交付什么，还欠缺什么</text>
  <text x="64" y="114" class="sans muted claim">上一节的交付就是下一节的输入。三节交出名单、Context 与可检查声明；还欠缺引文定位与内容支持。</text>
  <rect x="1296" y="44" width="240" height="48" rx="24" fill="#EAF1FC" stroke="#AFC3E3" stroke-width="1.5"/>
  <text x="1416" y="75" text-anchor="middle" class="sans ink chip">第 17 节 · 已有输入</text>

  <rect x="64" y="148" width="1472" height="620" rx="24" fill="#FFFFFF" stroke="#86A9D9" stroke-width="2.5"/>
  <text x="96" y="190" class="sans band-title" fill="#1557B0">同一条售后规则依次换手</text>
  <text x="96" y="218" class="sans muted small">第 13 节融合榜进入第 14 节；身份从名单到声明保持同一个。</text>

  <!-- 14 -->
  <rect x="96" y="244" width="432" height="292" rx="16" class="data"/>
  <rect x="116" y="260" width="88" height="28" rx="14" fill="#1557B0"/>
  <text x="160" y="280" text-anchor="middle" class="sans chip" fill="#FFFFFF">第 14 节</text>
  <text x="312" y="318" text-anchor="middle" class="sans ink card-title">最终检索名单</text>

  <text x="124" y="358" class="sans label" fill="#0F7C83">输入</text>
  <text x="188" y="358" class="sans muted card-copy">第 13 节的融合榜</text>

  <rect x="116" y="378" width="392" height="64" rx="12" fill="#FFFFFF" stroke="#0F7C83" stroke-width="1.8"/>
  <text x="136" y="404" class="sans label" fill="#0F7C83">交付</text>
  <text x="312" y="404" text-anchor="middle" class="sans ink small">最终名单 + 检索诊断</text>
  <text x="312" y="428" text-anchor="middle" class="sans muted card-copy">过滤、条数、阈值、截断已按固定顺序走完</text>

  <rect x="116" y="454" width="392" height="64" rx="12" fill="#FFF8EE" stroke="#C76B00" stroke-width="1.8"/>
  <text x="136" y="480" class="sans label" fill="#C76B00">还欠缺</text>
  <text x="312" y="480" text-anchor="middle" class="sans ink small">本轮 Context</text>
  <text x="312" y="504" text-anchor="middle" class="sans muted card-copy">名单还要装成模型真正看见的文字</text>

  <path d="M528 390H576" class="arrow"/>

  <!-- 15 -->
  <rect x="584" y="244" width="432" height="292" rx="16" class="data"/>
  <rect x="604" y="260" width="88" height="28" rx="14" fill="#1557B0"/>
  <text x="648" y="280" text-anchor="middle" class="sans chip" fill="#FFFFFF">第 15 节</text>
  <text x="800" y="318" text-anchor="middle" class="sans ink card-title">本轮 Context</text>

  <text x="612" y="358" class="sans label" fill="#0F7C83">输入</text>
  <text x="676" y="358" class="sans muted card-copy">最终检索名单</text>

  <rect x="604" y="378" width="392" height="64" rx="12" fill="#FFFFFF" stroke="#0F7C83" stroke-width="1.8"/>
  <text x="624" y="404" class="sans label" fill="#0F7C83">交付</text>
  <text x="800" y="404" text-anchor="middle" class="sans ink small">看见的文字 + 允许集合</text>
  <text x="800" y="428" text-anchor="middle" class="sans muted card-copy">允许声明的身份 = 装进 Evidence 的身份</text>

  <rect x="604" y="454" width="392" height="64" rx="12" fill="#FFF8EE" stroke="#C76B00" stroke-width="1.8"/>
  <text x="624" y="480" class="sans label" fill="#C76B00">还欠缺</text>
  <text x="800" y="480" text-anchor="middle" class="sans ink small">模型结论与编号检查</text>
  <text x="800" y="504" text-anchor="middle" class="sans muted card-copy">下一步生成结论，并检查编号</text>

  <path d="M1016 390H1064" class="arrow"/>

  <!-- 16 -->
  <rect x="1072" y="244" width="432" height="292" rx="16" class="model"/>
  <rect x="1092" y="260" width="88" height="28" rx="14" fill="#1557B0"/>
  <text x="1136" y="280" text-anchor="middle" class="sans chip" fill="#FFFFFF">第 16 节</text>
  <text x="1288" y="318" text-anchor="middle" class="sans ink card-title">来源声明检查</text>

  <text x="1100" y="358" class="sans label" fill="#5B45C6">输入</text>
  <text x="1164" y="358" class="sans muted card-copy">Context 与允许集合</text>

  <rect x="1092" y="378" width="392" height="64" rx="12" fill="#FFFFFF" stroke="#5B45C6" stroke-width="1.8"/>
  <text x="1112" y="404" class="sans label" fill="#5B45C6">交付</text>
  <text x="1288" y="404" text-anchor="middle" class="sans ink small">结构化风险 + 成员检查</text>
  <text x="1288" y="428" text-anchor="middle" class="sans muted card-copy">已声明编号属于本轮允许集合</text>

  <rect x="1092" y="454" width="392" height="64" rx="12" fill="#FFF8EE" stroke="#C76B00" stroke-width="1.8"/>
  <text x="1112" y="480" class="sans label" fill="#C76B00">还欠缺</text>
  <text x="1288" y="480" text-anchor="middle" class="sans ink small">引文定位与内容支持</text>
  <text x="1288" y="504" text-anchor="middle" class="sans muted card-copy">下一步核对应来源中的原话</text>

  <!-- A/B band -->
  <rect x="96" y="560" width="1408" height="180" rx="18" fill="#F5F8FD" stroke="#C4D4EA" stroke-width="1.5"/>
  <text x="120" y="596" class="sans band-title" fill="#1557B0">同一份售后资料上，交付物怎样换手</text>

  <rect x="120" y="616" width="384" height="100" rx="14" class="card"/>
  <text x="312" y="656" text-anchor="middle" class="sans ink small">A、B 都在最终名单里</text>
  <text x="312" y="688" text-anchor="middle" class="sans muted card-copy">下一节要决定它们怎样装入 Context</text>

  <rect x="608" y="616" width="384" height="100" rx="14" class="card"/>
  <text x="800" y="656" text-anchor="middle" class="sans ink small">允许集合 = 已装入的身份</text>
  <text x="800" y="688" text-anchor="middle" class="sans muted card-copy">A 装入则在集合中；B 未装入则留在名单侧</text>

  <rect x="1096" y="616" width="384" height="100" rx="14" class="card"/>
  <text x="1288" y="656" text-anchor="middle" class="sans ink small">通过检查的声明交给第 17 节</text>
  <text x="1288" y="688" text-anchor="middle" class="sans muted card-copy">集合外的简称停在第 16 节的检查结果里</text>

  <rect x="64" y="792" width="1472" height="76" rx="18" fill="#FFF8EE" stroke="#E1B370" stroke-width="1.8"/>
  <circle cx="104" cy="830" r="20" fill="#C76B00"/>
  <text x="104" y="838" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#FFFFFF">!</text>
  <text x="144" y="838" class="sans ink takeaway">第 16 节交付「编号属于允许集合」；还欠缺引文是否存在、内容是否支持。交给第 17 节。</text>
</svg>
