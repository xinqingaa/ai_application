<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chunking：重组检索单元，保留来源链</title>
  <desc id="desc">文档元素经由切片策略形成用于命中的 Child Chunk 和用于补充语境的 Parent Chunk，每个 Chunk 都保留稳定身份、来源跨度、业务过滤信息和策略身份。</desc>
  <defs>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1557B0"/></marker>
    <marker id="arrow-data" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#0F7C83"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102A56}.muted{fill:#536986}.title{font-size:44px;font-weight:750;letter-spacing:-.6px}.claim{font-size:21px;font-weight:450}.band-title{font-size:22px;font-weight:700}.card-title{font-size:24px;font-weight:700}.card-copy{font-size:17px;font-weight:450}.small{font-size:16px;font-weight:550}.chip{font-size:16px;font-weight:700}.takeaway{font-size:24px;font-weight:700}.card{fill:#fff;stroke:#AFC3E3;stroke-width:2}.data{fill:#F2FAFA;stroke:#0F7C83;stroke-width:2.5}.primary{fill:#F5F8FD;stroke:#1557B0;stroke-width:2.5}.caution{fill:#FFF8EE;stroke:#C76B00;stroke-width:2}.arrow{fill:none;stroke:#1557B0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-primary)}.data-arrow{fill:none;stroke:#0F7C83;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-data)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text x="64" y="76" class="sans ink title">Chunking：重组检索单元，保留来源链</text>
  <text x="64" y="119" class="sans muted claim">Element 描述原文结构；Chunk 描述检索策略。粒度、overlap 与父子块改变组织方式，不改变原文身份。</text>
  <rect x="1328" y="48" width="208" height="48" rx="24" fill="#EAF1FC" stroke="#AFC3E3" stroke-width="1.5"/>
  <text x="1432" y="79" text-anchor="middle" class="sans ink chip">第 9 节 · 检索单元</text>

  <rect x="64" y="158" width="1472" height="610" rx="24" fill="#fff" stroke="#86A9D9" stroke-width="2.5"/>
  <text x="96" y="202" class="sans band-title" fill="#1557B0">从来源形态到检索形态</text>

  <rect x="96" y="244" width="252" height="252" rx="18" class="card"/>
  <text x="222" y="283" text-anchor="middle" class="sans ink card-title">DocumentElement[]</text>
  <rect x="124" y="309" width="196" height="48" rx="10" fill="#F5F8FD" stroke="#AFC3E3"/>
  <text x="222" y="340" text-anchor="middle" class="sans muted card-copy">标题｜售后入口</text>
  <rect x="124" y="369" width="196" height="48" rx="10" fill="#F5F8FD" stroke="#AFC3E3"/>
  <text x="222" y="400" text-anchor="middle" class="sans muted card-copy">规则｜已支付且完成</text>
  <rect x="124" y="429" width="196" height="48" rx="10" fill="#F5F8FD" stroke="#AFC3E3"/>
  <text x="222" y="460" text-anchor="middle" class="sans muted card-copy">例外｜虚拟商品</text>

  <path d="M348 370H402" class="data-arrow"/>

  <rect x="412" y="224" width="300" height="292" rx="18" class="data"/>
  <text x="562" y="265" text-anchor="middle" class="sans ink card-title">Chunk 策略</text>
  <text x="562" y="306" text-anchor="middle" class="sans muted card-copy">size 控制容量</text>
  <text x="562" y="338" text-anchor="middle" class="sans muted card-copy">overlap 补偿边界</text>
  <text x="562" y="370" text-anchor="middle" class="sans muted card-copy">结构提示自然边界</text>
  <line x1="448" y1="398" x2="676" y2="398" stroke="#B9DADB" stroke-width="1.5"/>
  <text x="562" y="433" text-anchor="middle" class="sans small" fill="#0F7C83">策略只组织文本</text>
  <text x="562" y="462" text-anchor="middle" class="sans small" fill="#C76B00">不会理解条件与例外</text>

  <path d="M712 316H760" class="arrow"/>
  <path d="M712 424H760" class="arrow"/>

  <rect x="770" y="216" width="322" height="202" rx="18" class="primary"/>
  <text x="931" y="257" text-anchor="middle" class="sans ink card-title">Child Chunk｜用于命中</text>
  <rect x="798" y="283" width="126" height="104" rx="12" fill="#fff" stroke="#1557B0" stroke-width="1.7"/>
  <text x="861" y="319" text-anchor="middle" class="sans ink card-copy">状态条件</text>
  <text x="861" y="350" text-anchor="middle" class="sans small muted">child-A</text>
  <rect x="938" y="283" width="126" height="104" rx="12" fill="#fff" stroke="#1557B0" stroke-width="1.7"/>
  <text x="1001" y="319" text-anchor="middle" class="sans ink card-copy">商品例外</text>
  <text x="1001" y="350" text-anchor="middle" class="sans small muted">child-B</text>

  <rect x="770" y="442" width="322" height="132" rx="18" class="data"/>
  <text x="931" y="483" text-anchor="middle" class="sans ink card-title">Parent Chunk｜补充语境</text>
  <text x="931" y="522" text-anchor="middle" class="sans muted card-copy">命中 Child 后带回规则组</text>
  <text x="931" y="551" text-anchor="middle" class="sans small" fill="#0F7C83">父子关系属于检索策略</text>

  <path d="M1092 370H1140" class="data-arrow"/>

  <rect x="1150" y="216" width="354" height="358" rx="18" class="card"/>
  <text x="1327" y="257" text-anchor="middle" class="sans ink card-title">每个 Chunk 的追踪契约</text>
  <rect x="1178" y="283" width="298" height="54" rx="11" fill="#F2FAFA" stroke="#B9DADB"/>
  <text x="1327" y="317" text-anchor="middle" class="sans ink card-copy">稳定 chunk_id</text>
  <rect x="1178" y="349" width="298" height="54" rx="11" fill="#F2FAFA" stroke="#B9DADB"/>
  <text x="1327" y="383" text-anchor="middle" class="sans ink card-copy">ChunkSourceSpan → 原文位置</text>
  <rect x="1178" y="415" width="298" height="54" rx="11" fill="#F2FAFA" stroke="#B9DADB"/>
  <text x="1327" y="449" text-anchor="middle" class="sans ink card-copy">版本 · 来源角色 · 证据资格</text>
  <rect x="1178" y="481" width="298" height="54" rx="11" fill="#FFF8EE" stroke="#E1B370"/>
  <text x="1327" y="515" text-anchor="middle" class="sans ink card-copy">策略身份 · token 诊断</text>

  <rect x="96" y="614" width="1408" height="112" rx="16" fill="#F5F8FD" stroke="#C4D4EA" stroke-width="1.5"/>
  <text x="124" y="653" class="sans band-title" fill="#1557B0">粒度取舍</text>
  <text x="124" y="690" class="sans muted card-copy">更小：内容集中但关系易拆散　｜　更大：语境完整但噪声、token 与定位范围增加　｜　overlap：连续性增加，同时引入重复。</text>

  <rect x="64" y="792" width="1472" height="76" rx="18" fill="#FFF8EE" stroke="#E1B370" stroke-width="1.8"/>
  <circle cx="104" cy="830" r="20" fill="#C76B00"/>
  <text x="104" y="838" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#fff">!</text>
  <text x="144" y="838" class="sans ink takeaway">没有唯一最佳 Chunk；策略变化必须产生新身份，并通过后续召回与 Context 预算观察代价。</text>
</svg>
