<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">同一句引文，放回不同语境会得到不同关系</title>
  <desc id="desc">同一句“请求必须提供 source_channel”分别出现在现行售后规则、废弃规则、营销范围和范围不完整的资料中，会得到支持、反驳、无关和无法判断四种不同结果。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1557B0"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102A56}.muted{fill:#536986}.title{font-size:44px;font-weight:750;letter-spacing:-.6px}.claim{font-size:21px;font-weight:450}.card-title{font-size:24px;font-weight:700}.card-copy{font-size:17px;font-weight:450}.small{font-size:15px;font-weight:600}.chip{font-size:16px;font-weight:700}.quote{font-size:18px;font-weight:650}.takeaway{font-size:23px;font-weight:700}.branch{fill:none;stroke:#1557B0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text x="64" y="76" class="sans ink title">同一句引文，放回不同语境会得到不同关系</text>
  <text x="64" y="119" class="sans muted claim">文字存在只完成定位；版本、范围、条件和反向规则共同决定它能否支持当前 Claim。</text>
  <rect x="1304" y="48" width="232" height="48" rx="24" fill="#EAF1FC" stroke="#AFC3E3" stroke-width="1.5"/>
  <text x="1420" y="79" text-anchor="middle" class="sans ink chip">第 17 节 · 语境判断</text>

  <rect x="192" y="158" width="1216" height="112" rx="20" fill="#EAF1FC" stroke="#86A9D9" stroke-width="2.5"/>
  <text x="224" y="195" class="sans small" fill="#1557B0">要判断的 Claim</text>
  <text x="800" y="237" text-anchor="middle" class="sans ink card-title">现行售后接口 v2 的所有请求都必须提供 source_channel</text>

  <path d="M800 270V302H236V330" class="branch"/>
  <path d="M800 302H604V330" class="branch"/>
  <path d="M800 302H972V330" class="branch"/>
  <path d="M800 302H1340V330" class="branch"/>

  <rect x="64" y="340" width="344" height="390" rx="18" fill="#F4FAF6" stroke="#2C7A53" stroke-width="2.5"/>
  <rect x="88" y="364" width="112" height="36" rx="18" fill="#2C7A53"/>
  <text x="144" y="388" text-anchor="middle" class="sans chip" fill="#FFFFFF">支持</text>
  <text x="384" y="388" text-anchor="end" class="sans small" fill="#2C7A53">supported</text>
  <text x="92" y="438" class="sans ink card-title">现行 v2 · 全部入口</text>
  <text x="92" y="477" class="sans muted card-copy">规则明确覆盖现行售后接口</text>
  <text x="92" y="507" class="sans muted card-copy">没有例外或相反条件</text>
  <rect x="92" y="548" width="288" height="84" rx="12" fill="#FFFFFF" stroke="#9DCEB5"/>
  <text x="236" y="582" text-anchor="middle" class="sans small" fill="#2C7A53">逐字引文</text>
  <text x="236" y="614" text-anchor="middle" class="sans ink quote">请求必须提供 source_channel</text>
  <text x="236" y="684" text-anchor="middle" class="sans small" fill="#2C7A53">直接证明当前 Claim</text>

  <rect x="432" y="340" width="344" height="390" rx="18" fill="#FFF1F1" stroke="#C43D3D" stroke-width="2.5"/>
  <rect x="456" y="364" width="112" height="36" rx="18" fill="#C43D3D"/>
  <text x="512" y="388" text-anchor="middle" class="sans chip" fill="#FFFFFF">反驳</text>
  <text x="752" y="388" text-anchor="end" class="sans small" fill="#C43D3D">contradicted</text>
  <text x="460" y="438" class="sans ink card-title">废弃 v1 · 现行 v2 相反</text>
  <text x="460" y="477" class="sans muted card-copy">旧规则保留了同一句文字</text>
  <text x="460" y="507" class="sans muted card-copy">后文明确现行 v2 允许省略</text>
  <rect x="460" y="548" width="288" height="84" rx="12" fill="#FFFFFF" stroke="#E3A2A2"/>
  <text x="604" y="582" text-anchor="middle" class="sans small" fill="#C43D3D">逐字引文</text>
  <text x="604" y="614" text-anchor="middle" class="sans ink quote">请求必须提供 source_channel</text>
  <text x="604" y="684" text-anchor="middle" class="sans small" fill="#C43D3D">完整语境给出相反规则</text>

  <rect x="800" y="340" width="344" height="390" rx="18" fill="#FFF8EE" stroke="#C76B00" stroke-width="2.5"/>
  <rect x="824" y="364" width="112" height="36" rx="18" fill="#C76B00"/>
  <text x="880" y="388" text-anchor="middle" class="sans chip" fill="#FFFFFF">无关</text>
  <text x="1120" y="388" text-anchor="end" class="sans small" fill="#C76B00">unrelated</text>
  <text x="828" y="438" class="sans ink card-title">营销曝光 · 非售后范围</text>
  <text x="828" y="477" class="sans muted card-copy">字段名称与引文完全相同</text>
  <text x="828" y="507" class="sans muted card-copy">来源明确排除售后接口</text>
  <rect x="828" y="548" width="288" height="84" rx="12" fill="#FFFFFF" stroke="#E1B370"/>
  <text x="972" y="582" text-anchor="middle" class="sans small" fill="#C76B00">逐字引文</text>
  <text x="972" y="614" text-anchor="middle" class="sans ink quote">请求必须提供 source_channel</text>
  <text x="972" y="684" text-anchor="middle" class="sans small" fill="#C76B00">取到了另一个业务范围</text>

  <rect x="1168" y="340" width="344" height="390" rx="18" fill="#F5F8FD" stroke="#7C91AE" stroke-width="2.5"/>
  <rect x="1192" y="364" width="128" height="36" rx="18" fill="#536986"/>
  <text x="1256" y="388" text-anchor="middle" class="sans chip" fill="#FFFFFF">无法判断</text>
  <text x="1488" y="388" text-anchor="end" class="sans small" fill="#536986">indeterminate</text>
  <text x="1196" y="438" class="sans ink card-title">部分请求 · 适用范围缺失</text>
  <text x="1196" y="477" class="sans muted card-copy">资料与售后接口相关</text>
  <text x="1196" y="507" class="sans muted card-copy">但没有记录哪些入口适用</text>
  <rect x="1196" y="548" width="288" height="84" rx="12" fill="#FFFFFF" stroke="#AFC3E3"/>
  <text x="1340" y="582" text-anchor="middle" class="sans small" fill="#536986">逐字引文</text>
  <text x="1340" y="614" text-anchor="middle" class="sans ink quote">请求必须提供 source_channel</text>
  <text x="1340" y="684" text-anchor="middle" class="sans small" fill="#536986">相关，但关键条件不足</text>

  <rect x="64" y="792" width="1472" height="76" rx="18" fill="#FFF8EE" stroke="#E1B370" stroke-width="1.8"/>
  <circle cx="104" cy="830" r="20" fill="#C76B00"/>
  <text x="104" y="838" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#FFFFFF">!</text>
  <text x="144" y="838" class="sans ink takeaway">逐字相同不等于语义支持；判断必须同时读取当前版本、业务范围、适用条件和反向规则。</text>
</svg>
