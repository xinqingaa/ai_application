<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">相同 Claim 和逐字引文在不同语境中形成四种支持关系</title>
  <desc id="desc">要判断的 Claim 是现行售后接口 v2 的所有请求都必须提供 source_channel。相同引文放入现行规则、废弃规则、营销范围和条件不全的来源时，分别得到支持、反驳、无关和无法判断。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1557B0"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102A56}.muted{fill:#536986}.label{font-size:16px;font-weight:750}.claim{font-size:24px;font-weight:750}.verdict{font-size:22px;font-weight:750}.name{font-size:22px;font-weight:750}.copy{font-size:17px;font-weight:500}.quote{font-size:17px;font-weight:650}.branch{fill:none;stroke:#1557B0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#F7F9FC"/>

  <rect x="190" y="44" width="1220" height="124" rx="20" fill="#EAF1FC" stroke="#86A9D9" stroke-width="2.5"/>
  <text x="222" y="80" class="sans label" fill="#1557B0">固定不变的 Claim 与逐字引文</text>
  <text x="800" y="120" text-anchor="middle" class="sans claim ink">现行售后接口 v2 的所有请求都必须提供 source_channel</text>
  <text x="800" y="150" text-anchor="middle" class="sans quote muted">“请求必须提供 source_channel”</text>

  <path d="M800 168V194H236V220" class="branch"/>
  <path d="M800 194H612V220" class="branch"/>
  <path d="M800 194H988V220" class="branch"/>
  <path d="M800 194H1364V220" class="branch"/>

  <rect x="52" y="232" width="344" height="464" rx="20" fill="#F4FAF6" stroke="#2C7A53" stroke-width="2.5"/>
  <rect x="78" y="258" width="126" height="40" rx="20" fill="#2C7A53"/>
  <text x="141" y="285" text-anchor="middle" class="sans verdict" fill="#fff">支持</text>
  <text x="370" y="285" text-anchor="end" class="sans label" fill="#2C7A53">supported</text>
  <text x="78" y="348" class="sans name ink">现行 v2 · 全部入口</text>
  <text x="78" y="390" class="sans copy muted">规则明确覆盖现行售后接口，</text>
  <text x="78" y="420" class="sans copy muted">没有例外或相反条件。</text>
  <rect x="78" y="462" width="292" height="94" rx="14" fill="#fff" stroke="#9DCEB5"/>
  <text x="224" y="498" text-anchor="middle" class="sans label" fill="#2C7A53">语境中的关键条件</text>
  <text x="224" y="532" text-anchor="middle" class="sans quote ink">现行 · v2 · 全部请求</text>
  <text x="224" y="628" text-anchor="middle" class="sans verdict" fill="#2C7A53">直接证明 Claim</text>

  <rect x="428" y="232" width="344" height="464" rx="20" fill="#FFF1F1" stroke="#C43D3D" stroke-width="2.5"/>
  <rect x="454" y="258" width="126" height="40" rx="20" fill="#C43D3D"/>
  <text x="517" y="285" text-anchor="middle" class="sans verdict" fill="#fff">反驳</text>
  <text x="746" y="285" text-anchor="end" class="sans label" fill="#C43D3D">contradicted</text>
  <text x="454" y="348" class="sans name ink">废弃 v1 · 现行规则相反</text>
  <text x="454" y="390" class="sans copy muted">旧规则保留了同一句引文，</text>
  <text x="454" y="420" class="sans copy muted">后文却明确 v2 允许省略。</text>
  <rect x="454" y="462" width="292" height="94" rx="14" fill="#fff" stroke="#E3A2A2"/>
  <text x="600" y="498" text-anchor="middle" class="sans label" fill="#C43D3D">语境中的关键条件</text>
  <text x="600" y="532" text-anchor="middle" class="sans quote ink">废弃 · v1 · v2 允许省略</text>
  <text x="600" y="628" text-anchor="middle" class="sans verdict" fill="#C43D3D">给出相反结论</text>

  <rect x="804" y="232" width="344" height="464" rx="20" fill="#FFF8EE" stroke="#C76B00" stroke-width="2.5"/>
  <rect x="830" y="258" width="126" height="40" rx="20" fill="#C76B00"/>
  <text x="893" y="285" text-anchor="middle" class="sans verdict" fill="#fff">无关</text>
  <text x="1122" y="285" text-anchor="end" class="sans label" fill="#C76B00">unrelated</text>
  <text x="830" y="348" class="sans name ink">营销曝光 · 排除售后</text>
  <text x="830" y="390" class="sans copy muted">字段名称与引文完全相同，</text>
  <text x="830" y="420" class="sans copy muted">来源却明确不适用于售后。</text>
  <rect x="830" y="462" width="292" height="94" rx="14" fill="#fff" stroke="#E1B370"/>
  <text x="976" y="498" text-anchor="middle" class="sans label" fill="#C76B00">语境中的关键条件</text>
  <text x="976" y="532" text-anchor="middle" class="sans quote ink">营销渠道 · 非售后接口</text>
  <text x="976" y="628" text-anchor="middle" class="sans verdict" fill="#C76B00">取错业务范围</text>

  <rect x="1180" y="232" width="368" height="464" rx="20" fill="#F5F8FD" stroke="#7C91AE" stroke-width="2.5"/>
  <rect x="1206" y="258" width="142" height="40" rx="20" fill="#536986"/>
  <text x="1277" y="285" text-anchor="middle" class="sans verdict" fill="#fff">无法判断</text>
  <text x="1522" y="285" text-anchor="end" class="sans label" fill="#536986">indeterminate</text>
  <text x="1206" y="348" class="sans name ink">售后相关 · 条件不完整</text>
  <text x="1206" y="390" class="sans copy muted">资料与当前主题有关，</text>
  <text x="1206" y="420" class="sans copy muted">但没有记录哪些入口适用。</text>
  <rect x="1206" y="462" width="316" height="94" rx="14" fill="#fff" stroke="#AFC3E3"/>
  <text x="1364" y="498" text-anchor="middle" class="sans label" fill="#536986">语境中的关键条件</text>
  <text x="1364" y="532" text-anchor="middle" class="sans quote ink">范围或版本信息缺失</text>
  <text x="1364" y="628" text-anchor="middle" class="sans verdict" fill="#536986">相关，但条件不足</text>
</svg>
