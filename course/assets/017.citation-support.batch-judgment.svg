<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">先全量定位，再只对可判断项调用一次模型</title>
  <desc id="desc">五条候选来源声明先经过确定性引文定位，三条唯一定位成功后合并为一次模型调用，两条定位失败保留原结果。模型返回的 claim_id 集合和顺序必须与输入一致，只有 supported 项形成 VerifiedCitation。</desc>
  <defs>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1557B0"/></marker>
    <marker id="arrow-data" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#0F7C83"/></marker>
    <marker id="arrow-caution" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#C76B00"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102A56}.muted{fill:#536986}.title{font-size:44px;font-weight:750;letter-spacing:-.6px}.claim{font-size:21px;font-weight:450}.band-title{font-size:22px;font-weight:700}.card-title{font-size:22px;font-weight:700}.card-copy{font-size:16px;font-weight:450}.small{font-size:15px;font-weight:600}.chip{font-size:16px;font-weight:700}.takeaway{font-size:23px;font-weight:700}.card{fill:#FFFFFF;stroke:#AFC3E3;stroke-width:2}.data{fill:#F2FAFA;stroke:#0F7C83;stroke-width:2.5}.model{fill:#F5F3FF;stroke:#5B45C6;stroke-width:2.5}.output{fill:#F4FAF6;stroke:#2C7A53;stroke-width:2.5}.caution{fill:#FFF8EE;stroke:#C76B00;stroke-width:2}.arrow{fill:none;stroke:#1557B0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-primary)}.data-arrow{fill:none;stroke:#0F7C83;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-data)}.caution-arrow{fill:none;stroke:#C76B00;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-caution)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text x="64" y="76" class="sans ink title">先全量定位，再只对可判断项调用一次模型</text>
  <text x="64" y="119" class="sans muted claim">批量减少调用次数，但每条声明的位置、身份和关系仍独立记录，不能用批量掩盖缺失结果。</text>
  <rect x="1296" y="48" width="240" height="48" rx="24" fill="#EAF1FC" stroke="#AFC3E3" stroke-width="1.5"/>
  <text x="1416" y="79" text-anchor="middle" class="sans ink chip">第 17 节 · 批量判断</text>

  <rect x="64" y="158" width="1472" height="610" rx="24" fill="#FFFFFF" stroke="#86A9D9" stroke-width="2.5"/>
  <text x="96" y="202" class="sans band-title" fill="#1557B0">一次运行中的四个步骤</text>

  <rect x="96" y="246" width="260" height="294" rx="18" class="data"/>
  <text x="226" y="286" text-anchor="middle" class="sans ink card-title">候选来源声明</text>
  <text x="226" y="320" text-anchor="middle" class="sans muted card-copy">5 个稳定 claim_id</text>
  <rect x="128" y="352" width="196" height="132" rx="14" fill="#FFFFFF" stroke="#0F7C83"/>
  <text x="226" y="385" text-anchor="middle" class="sans small" fill="#0F7C83">c1 · c2 · c3</text>
  <text x="226" y="421" text-anchor="middle" class="sans small" fill="#0F7C83">c4 · c5</text>
  <line x1="152" y1="444" x2="300" y2="444" stroke="#B9DADB"/>
  <text x="226" y="470" text-anchor="middle" class="sans small muted">各自带 Claim、来源和引文</text>
  <text x="226" y="516" text-anchor="middle" class="sans small" fill="#0F7C83">输入数量 = 5</text>

  <path d="M356 393H412" class="data-arrow"/>
  <rect x="422" y="226" width="318" height="334" rx="18" class="card"/>
  <text x="581" y="267" text-anchor="middle" class="sans ink card-title">确定性引文定位</text>
  <text x="581" y="301" text-anchor="middle" class="sans muted card-copy">全部声明先经过同一位置门</text>
  <rect x="454" y="336" width="254" height="78" rx="12" fill="#F2FAFA" stroke="#0F7C83"/>
  <text x="581" y="368" text-anchor="middle" class="sans small" fill="#0F7C83">c1 · c2 · c3</text>
  <text x="581" y="395" text-anchor="middle" class="sans small muted">唯一定位 → 进入判断</text>
  <rect x="454" y="430" width="254" height="92" rx="12" fill="#FFF8EE" stroke="#C76B00"/>
  <text x="581" y="462" text-anchor="middle" class="sans small" fill="#C76B00">c4 · c5</text>
  <text x="581" y="489" text-anchor="middle" class="sans small muted">找不到 / 不唯一 → 停止</text>
  <text x="581" y="516" text-anchor="middle" class="sans small muted">保留原始定位结果</text>

  <path d="M740 375H800" class="data-arrow"/>
  <text x="770" y="356" text-anchor="middle" class="sans small" fill="#0F7C83">只传 3 条</text>
  <rect x="810" y="246" width="284" height="294" rx="18" class="model"/>
  <text x="952" y="286" text-anchor="middle" class="sans ink card-title">一次结构化模型调用</text>
  <text x="952" y="322" text-anchor="middle" class="sans muted card-copy">完整语境判断支持关系</text>
  <rect x="846" y="356" width="212" height="100" rx="14" fill="#FFFFFF" stroke="#5B45C6"/>
  <text x="952" y="390" text-anchor="middle" class="sans small" fill="#5B45C6">expected IDs</text>
  <text x="952" y="426" text-anchor="middle" class="sans ink card-title">[c1, c2, c3]</text>
  <text x="952" y="494" text-anchor="middle" class="sans small" fill="#5B45C6">model_call_count = 1</text>

  <path d="M1094 393H1154" class="arrow"/>
  <rect x="1164" y="218" width="340" height="350" rx="18" class="output"/>
  <text x="1334" y="259" text-anchor="middle" class="sans ink card-title">身份集合与顺序检查</text>
  <text x="1334" y="295" text-anchor="middle" class="sans muted card-copy">actual IDs 必须逐项等于 expected</text>
  <rect x="1196" y="330" width="276" height="70" rx="12" fill="#FFFFFF" stroke="#2C7A53"/>
  <text x="1334" y="359" text-anchor="middle" class="sans small" fill="#2C7A53">完全一致</text>
  <text x="1334" y="385" text-anchor="middle" class="sans small muted">逐条写回 verdict 与 reason</text>
  <rect x="1196" y="416" width="276" height="82" rx="12" fill="#FFF8EE" stroke="#C76B00"/>
  <text x="1334" y="447" text-anchor="middle" class="sans small" fill="#C76B00">少回 · 多回 · 重复 · 调序</text>
  <text x="1334" y="477" text-anchor="middle" class="sans small muted">整批 judgment_set_invalid</text>
  <text x="1334" y="536" text-anchor="middle" class="sans small" fill="#2C7A53">仅 supported → VerifiedCitation</text>

  <path d="M581 522V606" class="caution-arrow"/>
  <rect x="328" y="616" width="506" height="112" rx="16" class="caution"/>
  <text x="581" y="657" text-anchor="middle" class="sans ink card-title">定位失败项不进入模型</text>
  <text x="581" y="695" text-anchor="middle" class="sans muted card-copy">它们仍留在 CitationSupportCheck 和报告中，不被丢弃或自动修复</text>

  <rect x="896" y="616" width="608" height="112" rx="16" fill="#F4FAF6" stroke="#2C7A53" stroke-width="2"/>
  <text x="1200" y="657" text-anchor="middle" class="sans ink card-title">判断结果逐条保留</text>
  <text x="1200" y="695" text-anchor="middle" class="sans muted card-copy">支持进入已验证集合；反驳、无关、无法判断继续作为诊断事实</text>

  <rect x="64" y="792" width="1472" height="76" rx="18" fill="#EAF1FC" stroke="#86A9D9" stroke-width="1.8"/>
  <circle cx="104" cy="830" r="20" fill="#1557B0"/>
  <text x="104" y="838" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#FFFFFF">1</text>
  <text x="144" y="838" class="sans ink takeaway">批量只把多条已定位项目合成一次调用；任何一条身份缺失、重复或调序都不能被当作成功。</text>
</svg>
