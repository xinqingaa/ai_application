<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">多条来源声明先全量定位再合并进行一次支持判断</title>
  <desc id="desc">五条候选声明先逐条做确定性定位，三条唯一定位成功后按稳定顺序合并为一次模型调用；两条定位失败保留在报告中。模型返回身份集合和顺序必须与输入一致。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1557B0"/></marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#C76B00"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102A56}.muted{fill:#536986}.step{font-size:17px;font-weight:750}.name{font-size:25px;font-weight:750}.copy{font-size:17px;font-weight:500}.small{font-size:16px;font-weight:650}.token{font-size:18px;font-weight:750}.arrow{fill:none;stroke:#1557B0;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-blue)}.branch{fill:none;stroke:#C76B00;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-orange)}
    </style>
  </defs>
  <rect width="1600" height="700" fill="#F7F9FC"/>

  <rect x="52" y="150" width="260" height="330" rx="20" fill="#F2FAFA" stroke="#0F7C83" stroke-width="2.5"/>
  <text x="80" y="190" class="sans step" fill="#0F7C83">输入</text>
  <text x="80" y="236" class="sans name ink">5 条候选声明</text>
  <text x="80" y="272" class="sans copy muted">各自带 Claim、来源和引文</text>
  <rect x="80" y="312" width="204" height="104" rx="14" fill="#fff" stroke="#0F7C83"/>
  <text x="182" y="350" text-anchor="middle" class="sans token" fill="#0F7C83">c1 · c2 · c3</text>
  <text x="182" y="390" text-anchor="middle" class="sans token" fill="#0F7C83">c4 · c5</text>
  <text x="80" y="454" class="sans small" fill="#0F7C83">input_count = 5</text>

  <path d="M312 315H370" class="arrow"/>

  <rect x="386" y="76" width="360" height="404" rx="22" fill="#fff" stroke="#0F7C83" stroke-width="3"/>
  <rect x="414" y="102" width="74" height="36" rx="18" fill="#0F7C83"/>
  <text x="451" y="127" text-anchor="middle" class="sans step" fill="#fff">1</text>
  <text x="414" y="184" class="sans name ink">逐条确定性定位</text>
  <text x="414" y="222" class="sans copy muted">全部声明先经过同一道位置门</text>
  <rect x="414" y="260" width="304" height="82" rx="14" fill="#F2FAFA" stroke="#0F7C83" stroke-width="2"/>
  <text x="566" y="292" text-anchor="middle" class="sans token" fill="#0F7C83">c1 · c2 · c3</text>
  <text x="566" y="322" text-anchor="middle" class="sans small ink">唯一定位 → 进入判断</text>
  <rect x="414" y="360" width="304" height="88" rx="14" fill="#FFF8EE" stroke="#C76B00" stroke-width="2"/>
  <text x="566" y="393" text-anchor="middle" class="sans token" fill="#C76B00">c4 · c5</text>
  <text x="566" y="424" text-anchor="middle" class="sans small ink">找不到 / 不唯一 → 停止</text>

  <path d="M746 278H814" class="arrow"/>
  <text x="780" y="258" text-anchor="middle" class="sans small" fill="#0F7C83">只传 3 条</text>

  <rect x="830" y="116" width="326" height="364" rx="22" fill="#F5F3FF" stroke="#5B45C6" stroke-width="3"/>
  <rect x="858" y="142" width="74" height="36" rx="18" fill="#5B45C6"/>
  <text x="895" y="167" text-anchor="middle" class="sans step" fill="#fff">2</text>
  <text x="858" y="224" class="sans name ink">一次模型调用</text>
  <text x="858" y="262" class="sans copy muted">完整语境判断支持关系</text>
  <rect x="858" y="302" width="270" height="92" rx="14" fill="#fff" stroke="#5B45C6"/>
  <text x="993" y="336" text-anchor="middle" class="sans small" fill="#5B45C6">expected IDs</text>
  <text x="993" y="372" text-anchor="middle" class="sans token ink">[c1, c2, c3]</text>
  <text x="858" y="444" class="sans small" fill="#5B45C6">model_call_count = 1</text>

  <path d="M1156 298H1214" class="arrow"/>

  <rect x="1230" y="76" width="318" height="404" rx="22" fill="#F4FAF6" stroke="#2C7A53" stroke-width="3"/>
  <rect x="1258" y="102" width="74" height="36" rx="18" fill="#2C7A53"/>
  <text x="1295" y="127" text-anchor="middle" class="sans step" fill="#fff">3</text>
  <text x="1258" y="184" class="sans name ink">检查身份并写回</text>
  <text x="1258" y="222" class="sans copy muted">actual IDs 必须逐项等于 expected</text>
  <rect x="1258" y="258" width="262" height="72" rx="14" fill="#fff" stroke="#2C7A53"/>
  <text x="1389" y="287" text-anchor="middle" class="sans small" fill="#2C7A53">完全一致</text>
  <text x="1389" y="316" text-anchor="middle" class="sans small ink">逐条保留 verdict 与 reason</text>
  <rect x="1258" y="348" width="262" height="88" rx="14" fill="#FFF1F1" stroke="#C43D3D"/>
  <text x="1389" y="380" text-anchor="middle" class="sans small" fill="#C43D3D">少回 · 多回 · 重复 · 调序</text>
  <text x="1389" y="411" text-anchor="middle" class="sans small ink">整批 judgment_set_invalid</text>

  <path d="M566 448V526" class="branch"/>
  <rect x="318" y="542" width="496" height="112" rx="18" fill="#FFF8EE" stroke="#C76B00" stroke-width="2"/>
  <text x="566" y="584" text-anchor="middle" class="sans token" fill="#C76B00">定位失败项仍留在报告中</text>
  <text x="566" y="620" text-anchor="middle" class="sans copy ink">不进入模型，也不被丢弃或自动修复</text>

  <rect x="878" y="542" width="670" height="112" rx="18" fill="#EAF1FC" stroke="#86A9D9" stroke-width="2"/>
  <text x="1213" y="584" text-anchor="middle" class="sans token" fill="#1557B0">批量只减少调用次数，不降低逐条契约</text>
  <text x="1213" y="620" text-anchor="middle" class="sans copy ink">仅 supported 形成 VerifiedCitation，其余关系继续作为诊断事实</text>
</svg>
