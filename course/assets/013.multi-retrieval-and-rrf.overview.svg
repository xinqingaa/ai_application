<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RRF：用排名融合多路候选</title>
  <desc id="desc">Lexical 与 Dense 分别输出带稳定 chunk_id 的有序候选和路线状态，RRF 只使用路线内排名计算贡献并按 chunk_id 汇合，原生分数保留用于诊断但不直接相加。</desc>
  <defs>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1557B0"/></marker>
    <marker id="arrow-data" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#0F7C83"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102A56}.muted{fill:#536986}.title{font-size:44px;font-weight:750;letter-spacing:-.6px}.claim{font-size:21px;font-weight:450}.band-title{font-size:22px;font-weight:700}.card-title{font-size:24px;font-weight:700}.card-copy{font-size:17px;font-weight:450}.small{font-size:16px;font-weight:550}.chip{font-size:16px;font-weight:700}.takeaway{font-size:24px;font-weight:700}.card{fill:#fff;stroke:#AFC3E3;stroke-width:2}.data{fill:#F2FAFA;stroke:#0F7C83;stroke-width:2.5}.primary{fill:#F5F8FD;stroke:#1557B0;stroke-width:2.5}.model{fill:#F5F3FF;stroke:#5B45C6;stroke-width:2.5}.output{fill:#F4FAF6;stroke:#2C7A53;stroke-width:2.5}.arrow{fill:none;stroke:#1557B0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-primary)}.data-arrow{fill:none;stroke:#0F7C83;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-data)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text x="64" y="76" class="sans ink title">RRF：用排名融合多路候选</text>
  <text x="64" y="119" class="sans muted claim">两路原生分数不在同一尺度；先统一候选契约，再按路线排名贡献汇合成一个稳定顺序。</text>
  <rect x="1328" y="48" width="208" height="48" rx="24" fill="#EAF1FC" stroke="#AFC3E3" stroke-width="1.5"/>
  <text x="1432" y="79" text-anchor="middle" class="sans ink chip">第 13 节 · 排名融合</text>

  <rect x="64" y="158" width="1472" height="610" rx="24" fill="#fff" stroke="#86A9D9" stroke-width="2.5"/>
  <text x="96" y="202" class="sans band-title" fill="#1557B0">两路候选汇合</text>

  <rect x="96" y="238" width="330" height="200" rx="18" class="primary"/>
  <text x="261" y="279" text-anchor="middle" class="sans ink card-title">Lexical 排名</text>
  <text x="126" y="319" class="sans ink card-copy">1　A｜source_channel</text>
  <text x="126" y="354" class="sans ink card-copy">2　C｜接口错误码</text>
  <text x="126" y="389" class="sans ink card-copy">3　B｜订单状态</text>
  <text x="396" y="418" text-anchor="end" class="sans small" fill="#1557B0">SUCCESS</text>
  <rect x="96" y="482" width="330" height="200" rx="18" class="data"/>
  <text x="261" y="523" text-anchor="middle" class="sans ink card-title">Dense 排名</text>
  <text x="126" y="563" class="sans ink card-copy">1　B｜订单状态</text>
  <text x="126" y="598" class="sans ink card-copy">2　A｜source_channel</text>
  <text x="126" y="633" class="sans ink card-copy">3　D｜售后入口</text>
  <text x="396" y="662" text-anchor="end" class="sans small" fill="#0F7C83">SUCCESS</text>

  <path d="M426 338H494V414H538" class="arrow"/>
  <path d="M426 582H494V466H538" class="data-arrow"/>

  <rect x="548" y="264" width="406" height="360" rx="20" class="model"/>
  <text x="751" y="307" text-anchor="middle" class="sans ink card-title">RRF 融合</text>
  <rect x="586" y="336" width="330" height="76" rx="14" fill="#fff" stroke="#5B45C6" stroke-width="1.7"/>
  <text x="751" y="369" text-anchor="middle" class="sans ink card-copy">贡献 = 1 / (rrf_k + route_rank)</text>
  <text x="751" y="397" text-anchor="middle" class="sans small muted">只使用路线内排名</text>
  <text x="751" y="457" text-anchor="middle" class="sans card-title" fill="#5B45C6">按 chunk_id 合并贡献</text>
  <text x="751" y="497" text-anchor="middle" class="sans muted card-copy">A：Lexical #1 + Dense #2</text>
  <text x="751" y="529" text-anchor="middle" class="sans muted card-copy">B：Lexical #3 + Dense #1</text>
  <line x1="594" y1="552" x2="908" y2="552" stroke="#D7D0FA" stroke-width="1.5"/>
  <text x="751" y="584" text-anchor="middle" class="sans small" fill="#C76B00">原生分数保留诊断，不参与相加</text>

  <path d="M954 444H1010" class="arrow"/>

  <rect x="1020" y="238" width="484" height="404" rx="20" class="output"/>
  <text x="1262" y="279" text-anchor="middle" class="sans ink card-title">统一融合名单</text>
  <rect x="1052" y="309" width="420" height="64" rx="12" fill="#fff" stroke="#2C7A53" stroke-width="1.5"/>
  <text x="1080" y="348" class="sans ink card-copy">1　A</text>
  <text x="1444" y="348" text-anchor="end" class="sans small" fill="#2C7A53">两路共同贡献</text>
  <rect x="1052" y="387" width="420" height="64" rx="12" fill="#fff" stroke="#2C7A53" stroke-width="1.5"/>
  <text x="1080" y="426" class="sans ink card-copy">2　B</text>
  <text x="1444" y="426" text-anchor="end" class="sans small" fill="#2C7A53">两路共同贡献</text>
  <rect x="1052" y="465" width="420" height="64" rx="12" fill="#fff" stroke="#AFC3E3" stroke-width="1.5"/>
  <text x="1080" y="504" class="sans ink card-copy">3　C / D</text>
  <text x="1444" y="504" text-anchor="end" class="sans small muted">单路贡献 + 稳定 tie-break</text>
  <text x="1262" y="570" text-anchor="middle" class="sans small" fill="#2C7A53">每条结果保留 route rank 与 route score</text>
  <text x="1262" y="603" text-anchor="middle" class="sans small" fill="#C76B00">融合不判断证据资格与支持性</text>

  <rect x="96" y="704" width="1408" height="42" rx="21" fill="#F5F8FD" stroke="#C4D4EA"/>
  <text x="800" y="731" text-anchor="middle" class="sans small muted">路线状态必须区分 SUCCESS、EMPTY 与 FAILED；空结果不是执行失败，失败路线也不能伪装成完整成功。</text>

  <rect x="64" y="792" width="1472" height="76" rx="18" fill="#FFF8EE" stroke="#E1B370" stroke-width="1.8"/>
  <circle cx="104" cy="830" r="20" fill="#C76B00"/>
  <text x="104" y="838" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#fff">!</text>
  <text x="144" y="838" class="sans ink takeaway">RRF 解决“多路排序怎样合并”，不解决“候选是否有资格、是否相关或是否足以支持结论”。</text>
</svg>
