<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">固定 RAG：资料怎样成为本轮生成依据</title>
  <desc id="desc">外部业务资料先离线完成解析、来源保留、切片、Embedding 向量化和索引，再在在线评审中经过检索、Context 装配、模型生成与应用校验，形成结构化结果和来源候选。</desc>

  <defs>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M1 1L11 6L1 11Z" fill="#1557B0"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M1 1L11 6L1 11Z" fill="#0F7C83"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .ink { fill: #102A56; }
      .muted { fill: #536986; }
      .title { font-size: 44px; font-weight: 750; letter-spacing: -0.6px; }
      .claim { font-size: 21px; font-weight: 450; }
      .band-title { font-size: 22px; font-weight: 700; }
      .card-title { font-size: 24px; font-weight: 700; }
      .card-copy { font-size: 17px; font-weight: 450; }
      .small { font-size: 16px; font-weight: 550; }
      .chip { font-size: 16px; font-weight: 700; }
      .takeaway { font-size: 24px; font-weight: 700; }
      .card { fill: #FFFFFF; stroke: #AFC3E3; stroke-width: 2; }
      .card-data { fill: #F2FAFA; stroke: #0F7C83; stroke-width: 2.5; }
      .card-model { fill: #F5F3FF; stroke: #5B45C6; stroke-width: 2.5; }
      .card-output { fill: #F4FAF6; stroke: #2C7A53; stroke-width: 2.5; }
      .main-arrow { fill: none; stroke: #1557B0; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-primary); }
      .data-arrow { fill: none; stroke: #0F7C83; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-data); }
      .diagnostic { fill: none; stroke: #536986; stroke-width: 2.5; stroke-dasharray: 8 8; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F7F9FC"/>

  <!-- Orientation zone -->
  <text x="64" y="76" class="sans ink title">固定 RAG：资料怎样成为本轮生成依据</text>
  <text x="64" y="119" class="sans muted claim">外部资料先成为可检索知识；本轮任务再沿应用预先确定的链路，变成候选、Context 与受检查的结果。</text>
  <rect x="1328" y="48" width="208" height="48" rx="24" fill="#EAF1FC" stroke="#AFC3E3" stroke-width="1.5"/>
  <text x="1432" y="79" text-anchor="middle" class="sans ink chip">第 7 节 · 概念总图</text>

  <!-- Main fixed-RAG boundary -->
  <rect x="64" y="158" width="1472" height="610" rx="24" fill="#FFFFFF" stroke="#86A9D9" stroke-width="2.5"/>
  <rect x="88" y="178" width="290" height="42" rx="21" fill="#1557B0"/>
  <text x="233" y="206" text-anchor="middle" class="sans chip" fill="#FFFFFF">固定 RAG · 步骤由应用预先确定</text>

  <!-- Offline band -->
  <rect x="88" y="238" width="1424" height="202" rx="18" fill="#F2FAFA" stroke="#B9DADB" stroke-width="1.5"/>
  <text x="112" y="273" class="sans band-title" fill="#0F7C83">知识生产｜离线准备</text>
  <text x="334" y="273" class="sans muted small">资料变化时运行，不在每次用户请求中重复解析</text>

  <rect x="112" y="298" width="224" height="112" rx="14" class="card-data"/>
  <text x="224" y="335" text-anchor="middle" class="sans ink card-title">外部业务资料</text>
  <text x="224" y="369" text-anchor="middle" class="sans muted card-copy">现行规则 · 接口文档</text>
  <text x="224" y="394" text-anchor="middle" class="sans muted card-copy">历史材料</text>

  <path d="M336 354H382" class="data-arrow"/>

  <rect x="392" y="298" width="256" height="112" rx="14" class="card"/>
  <text x="520" y="335" text-anchor="middle" class="sans ink card-title">解析并保留来源</text>
  <text x="520" y="369" text-anchor="middle" class="sans muted card-copy">恢复结构与阅读顺序</text>
  <text x="520" y="394" text-anchor="middle" class="sans muted card-copy">留下版本与原文位置</text>

  <path d="M648 354H694" class="data-arrow"/>

  <rect x="704" y="298" width="256" height="112" rx="14" class="card"/>
  <text x="832" y="335" text-anchor="middle" class="sans ink card-title">Chunk、向量化与索引</text>
  <text x="832" y="369" text-anchor="middle" class="sans muted card-copy">稳定身份 · Metadata</text>
  <text x="832" y="394" text-anchor="middle" class="sans muted card-copy">Lexical / Dense 两路</text>

  <path d="M960 354H1006" class="data-arrow"/>

  <rect x="1016" y="288" width="304" height="132" rx="16" class="card-data"/>
  <path d="M1050 326C1050 310 1098 310 1098 326V378C1098 394 1050 394 1050 378Z" fill="#FFFFFF" stroke="#0F7C83" stroke-width="2"/>
  <ellipse cx="1074" cy="326" rx="24" ry="9" fill="#E1F3F3" stroke="#0F7C83" stroke-width="2"/>
  <text x="1122" y="337" class="sans ink card-title">可检索知识</text>
  <text x="1122" y="369" class="sans muted card-copy">原文、身份与索引绑定</text>
  <text x="1122" y="394" class="sans muted card-copy">等待本轮 Query</text>

  <rect x="1340" y="300" width="152" height="100" rx="14" fill="#FFF8EE" stroke="#C76B00" stroke-width="1.8"/>
  <text x="1416" y="330" text-anchor="middle" class="sans small" fill="#8A4D00">当前边界</text>
  <text x="1416" y="358" text-anchor="middle" class="sans muted card-copy">当前不实现</text>
  <text x="1416" y="384" text-anchor="middle" class="sans muted card-copy">OCR / VLM 路线</text>

  <!-- Online band -->
  <rect x="88" y="460" width="1424" height="278" rx="18" fill="#F5F8FD" stroke="#C4D4EA" stroke-width="1.5"/>
  <text x="112" y="495" class="sans band-title" fill="#1557B0">本轮评审｜在线运行</text>
  <text x="324" y="495" class="sans muted small">同一条固定顺序：检索 → Context → 生成 → 校验</text>

  <rect x="112" y="525" width="220" height="148" rx="14" class="card"/>
  <text x="222" y="560" text-anchor="middle" class="sans ink card-title">本轮任务</text>
  <line x1="136" y1="578" x2="308" y2="578" stroke="#D6E0EF" stroke-width="1.5"/>
  <text x="222" y="608" text-anchor="middle" class="sans muted card-copy">待评审需求</text>
  <text x="222" y="636" text-anchor="middle" class="sans muted card-copy">评审问题 + 知识范围</text>
  <text x="222" y="660" text-anchor="middle" class="sans small" fill="#C76B00">需求不能自证</text>

  <path d="M332 599H374" class="main-arrow"/>

  <rect x="384" y="525" width="226" height="148" rx="14" class="card-data"/>
  <text x="497" y="560" text-anchor="middle" class="sans ink card-title">检索候选</text>
  <text x="497" y="598" text-anchor="middle" class="sans muted card-copy">Lexical + Dense</text>
  <text x="497" y="626" text-anchor="middle" class="sans muted card-copy">融合、过滤与截断</text>
  <text x="497" y="655" text-anchor="middle" class="sans small" fill="#0F7C83">输出候选与检索报告</text>

  <path d="M1170 420V508H642V548H610" class="data-arrow"/>
  <text x="904" y="498" text-anchor="middle" class="sans small" fill="#0F7C83">按本轮 Query 查询受控知识</text>

  <path d="M610 599H652" class="main-arrow"/>

  <rect x="662" y="525" width="226" height="148" rx="14" class="card-data"/>
  <text x="775" y="560" text-anchor="middle" class="sans ink card-title">装配 Context</text>
  <text x="775" y="598" text-anchor="middle" class="sans muted card-copy">Requirement / Evidence</text>
  <text x="775" y="626" text-anchor="middle" class="sans muted card-copy">按资格、去重与预算选择</text>
  <text x="775" y="655" text-anchor="middle" class="sans small" fill="#0F7C83">只允许声明已装入来源</text>

  <path d="M888 599H930" class="main-arrow"/>

  <rect x="940" y="525" width="242" height="148" rx="14" class="card-model"/>
  <text x="1061" y="560" text-anchor="middle" class="sans ink card-title">生成与应用校验</text>
  <text x="1061" y="598" text-anchor="middle" class="sans muted card-copy">LLM 生成结构化风险</text>
  <text x="1061" y="626" text-anchor="middle" class="sans muted card-copy">应用解析 Schema</text>
  <text x="1061" y="655" text-anchor="middle" class="sans small" fill="#5B45C6">应用检查来源集合</text>

  <path d="M1182 599H1224" class="main-arrow"/>

  <rect x="1234" y="525" width="250" height="148" rx="14" class="card-output"/>
  <text x="1359" y="560" text-anchor="middle" class="sans ink card-title">结构化评审结果</text>
  <text x="1359" y="598" text-anchor="middle" class="sans muted card-copy">风险 + 原始来源声明</text>
  <text x="1359" y="626" text-anchor="middle" class="sans muted card-copy">过程与失败诊断</text>
  <text x="1359" y="655" text-anchor="middle" class="sans small" fill="#2C7A53">此时仍只是来源候选</text>

  <!-- Diagnostics: dashed lines have one meaning in this figure -->
  <path d="M497 673V705H1061V673" class="diagnostic"/>
  <path d="M775 673V705" class="diagnostic"/>
  <text x="779" y="727" text-anchor="middle" class="sans small muted">虚线仅表示报告与回查路径：比较检索名单、最终 Context 与生成结果，定位第一次偏离</text>

  <!-- Takeaway zone -->
  <rect x="64" y="792" width="1472" height="76" rx="18" fill="#FFF8EE" stroke="#E1B370" stroke-width="1.8"/>
  <circle cx="104" cy="830" r="20" fill="#C76B00"/>
  <text x="104" y="838" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#FFFFFF">!</text>
  <text x="144" y="838" class="sans ink takeaway">检索到 ≠ 进入 Context ≠ 支持结论；前一层成功只是后一层的必要条件。</text>
  <rect x="1230" y="808" width="276" height="44" rx="22" fill="#FFFFFF" stroke="#C76B00" stroke-width="1.5"/>
  <text x="1368" y="836" text-anchor="middle" class="sans small" fill="#8A4D00">当前不包含 Agent 动态决策</text>
</svg>
