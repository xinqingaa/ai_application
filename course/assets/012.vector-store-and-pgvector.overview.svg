<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dense Retrieval：把向量比较接入资料库</title>
  <desc id="desc">离线 Chunk 向量连同身份和空间信息写入 PostgreSQL pgvector，在线 Query 用同一空间生成向量，先做 Metadata Filter，再选择 exact 或 ANN 搜索并输出距离排序候选。</desc>
  <defs>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1557B0"/></marker>
    <marker id="arrow-data" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#0F7C83"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102A56}.muted{fill:#536986}.title{font-size:44px;font-weight:750;letter-spacing:-.6px}.claim{font-size:21px;font-weight:450}.band-title{font-size:22px;font-weight:700}.card-title{font-size:24px;font-weight:700}.card-copy{font-size:17px;font-weight:450}.small{font-size:16px;font-weight:550}.chip{font-size:16px;font-weight:700}.takeaway{font-size:24px;font-weight:700}.card{fill:#fff;stroke:#AFC3E3;stroke-width:2}.data{fill:#F2FAFA;stroke:#0F7C83;stroke-width:2.5}.model{fill:#F5F3FF;stroke:#5B45C6;stroke-width:2.5}.output{fill:#F4FAF6;stroke:#2C7A53;stroke-width:2.5}.arrow{fill:none;stroke:#1557B0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-primary)}.data-arrow{fill:none;stroke:#0F7C83;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-data)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text x="64" y="76" class="sans ink title">Dense Retrieval：把向量比较接入资料库</text>
  <text x="64" y="119" class="sans muted claim">Embedding 服务负责表示；pgvector 负责保存、过滤与搜索。两者必须用空间身份和 Chunk 身份连接。</text>
  <rect x="1328" y="48" width="208" height="48" rx="24" fill="#EAF1FC" stroke="#AFC3E3" stroke-width="1.5"/>
  <text x="1432" y="79" text-anchor="middle" class="sans ink chip">第 12 节 · 向量检索</text>

  <rect x="64" y="158" width="1472" height="610" rx="24" fill="#fff" stroke="#86A9D9" stroke-width="2.5"/>
  <rect x="88" y="186" width="1424" height="202" rx="18" fill="#F2FAFA" stroke="#B9DADB" stroke-width="1.5"/>
  <text x="112" y="222" class="sans band-title" fill="#0F7C83">离线准备｜建立可搜索向量库</text>
  <rect x="112" y="250" width="224" height="108" rx="14" class="card"/>
  <text x="224" y="286" text-anchor="middle" class="sans ink card-title">Chunk + Metadata</text>
  <text x="224" y="324" text-anchor="middle" class="sans muted card-copy">稳定 chunk_id</text>
  <path d="M336 304H380" class="data-arrow"/>
  <rect x="390" y="250" width="244" height="108" rx="14" class="model"/>
  <text x="512" y="286" text-anchor="middle" class="sans ink card-title">Embedding 服务</text>
  <text x="512" y="324" text-anchor="middle" class="sans muted card-copy">固定模型与维度</text>
  <path d="M634 304H678" class="data-arrow"/>
  <rect x="688" y="238" width="428" height="132" rx="16" class="data"/>
  <text x="902" y="277" text-anchor="middle" class="sans ink card-title">PostgreSQL + pgvector</text>
  <text x="902" y="314" text-anchor="middle" class="sans muted card-copy">向量列 + Chunk 身份 + 业务 Metadata</text>
  <text x="902" y="343" text-anchor="middle" class="sans small" fill="#0F7C83">空间身份随数据保存</text>
  <path d="M1116 304H1142" class="data-arrow"/>
  <rect x="1152" y="250" width="332" height="108" rx="14" class="card"/>
  <text x="1318" y="286" text-anchor="middle" class="sans ink card-title">可选向量索引</text>
  <text x="1318" y="324" text-anchor="middle" class="sans muted card-copy">HNSW 属于明确空间</text>

  <rect x="88" y="410" width="1424" height="328" rx="18" fill="#F5F8FD" stroke="#C4D4EA" stroke-width="1.5"/>
  <text x="112" y="446" class="sans band-title" fill="#1557B0">在线查询｜资格范围先于近邻排序</text>
  <rect x="112" y="480" width="204" height="142" rx="14" class="card"/>
  <text x="214" y="518" text-anchor="middle" class="sans ink card-title">Query</text>
  <text x="214" y="557" text-anchor="middle" class="sans muted card-copy">同一空间生成向量</text>
  <text x="214" y="589" text-anchor="middle" class="sans small" fill="#1557B0">query vector</text>
  <path d="M316 551H358" class="arrow"/>
  <rect x="368" y="480" width="222" height="142" rx="14" class="data"/>
  <text x="479" y="518" text-anchor="middle" class="sans ink card-title">Metadata Filter</text>
  <text x="479" y="557" text-anchor="middle" class="sans muted card-copy">版本 · 来源角色</text>
  <text x="479" y="589" text-anchor="middle" class="sans small" fill="#0F7C83">谁有资格参加比较</text>
  <path d="M590 551H632" class="data-arrow"/>
  <rect x="642" y="464" width="316" height="174" rx="16" class="model"/>
  <text x="800" y="503" text-anchor="middle" class="sans ink card-title">选择搜索方式</text>
  <rect x="670" y="527" width="122" height="74" rx="12" fill="#fff" stroke="#5B45C6" stroke-width="1.5"/>
  <text x="731" y="557" text-anchor="middle" class="sans ink card-copy">Exact</text>
  <text x="731" y="584" text-anchor="middle" class="sans small muted">正确性基线</text>
  <rect x="808" y="527" width="122" height="74" rx="12" fill="#fff" stroke="#5B45C6" stroke-width="1.5"/>
  <text x="869" y="557" text-anchor="middle" class="sans ink card-copy">ANN</text>
  <text x="869" y="584" text-anchor="middle" class="sans small muted">性能取舍</text>
  <path d="M958 551H1000" class="arrow"/>
  <rect x="1010" y="480" width="236" height="142" rx="14" class="data"/>
  <text x="1128" y="518" text-anchor="middle" class="sans ink card-title">距离排序</text>
  <text x="1128" y="557" text-anchor="middle" class="sans muted card-copy">operator + limit</text>
  <text x="1128" y="589" text-anchor="middle" class="sans small" fill="#C76B00">距离方向需转换清楚</text>
  <path d="M1246 551H1288" class="data-arrow"/>
  <rect x="1298" y="480" width="186" height="142" rx="14" class="output"/>
  <text x="1391" y="518" text-anchor="middle" class="sans ink card-title">Dense 候选</text>
  <text x="1391" y="557" text-anchor="middle" class="sans muted card-copy">chunk_id + distance</text>
  <text x="1391" y="589" text-anchor="middle" class="sans small" fill="#2C7A53">保留查询计划</text>
  <text x="800" y="692" text-anchor="middle" class="sans small muted">索引存在 ≠ 本次一定使用；过滤、数据规模与查询计划共同决定真实路径。</text>

  <rect x="64" y="792" width="1472" height="76" rx="18" fill="#FFF8EE" stroke="#E1B370" stroke-width="1.8"/>
  <circle cx="104" cy="830" r="20" fill="#C76B00"/>
  <text x="104" y="838" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#fff">!</text>
  <text x="144" y="838" class="sans ink takeaway">先用 exact 建立正确性基线，再评估 ANN；返回 0 条可能来自过滤、空间不一致或真实无近邻。</text>
</svg>
