<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Retriever：候选依次通过五层控制</title>
  <desc id="desc">同一候选池依次经过 Metadata Filter、每路 candidate_k、每路原生阈值、RRF 融合和 final_top_k 截断；Retriever 同时输出最终候选与过程报告，说明候选第一次在哪一层消失。</desc>
  <defs>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1557B0"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102A56}.muted{fill:#536986}.title{font-size:44px;font-weight:750;letter-spacing:-.6px}.claim{font-size:21px;font-weight:450}.band-title{font-size:22px;font-weight:700}.card-title{font-size:22px;font-weight:700}.card-copy{font-size:16px;font-weight:450}.small{font-size:15px;font-weight:550}.chip{font-size:16px;font-weight:700}.takeaway{font-size:24px;font-weight:700}.gate{fill:#F5F8FD;stroke:#1557B0;stroke-width:2.3}.fuse{fill:#F5F3FF;stroke:#5B45C6;stroke-width:2.3}.output{fill:#F4FAF6;stroke:#2C7A53;stroke-width:2.3}.arrow{fill:none;stroke:#1557B0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-primary)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text x="64" y="76" class="sans ink title">Retriever：候选依次通过五层控制</text>
  <text x="64" y="119" class="sans muted claim">“数据库里存在”不等于会被返回；过滤、每路候选、阈值、融合与最终截断必须按固定顺序执行。</text>
  <rect x="1328" y="48" width="208" height="48" rx="24" fill="#EAF1FC" stroke="#AFC3E3" stroke-width="1.5"/>
  <text x="1432" y="79" text-anchor="middle" class="sans ink chip">第 14 节 · 控制顺序</text>

  <rect x="64" y="158" width="1472" height="610" rx="24" fill="#fff" stroke="#86A9D9" stroke-width="2.5"/>
  <text x="96" y="202" class="sans band-title" fill="#1557B0">同一批候选穿过连续控制点</text>
  <rect x="96" y="234" width="164" height="82" rx="14" fill="#F2FAFA" stroke="#0F7C83" stroke-width="2"/>
  <text x="178" y="267" text-anchor="middle" class="sans ink card-title">候选池</text>
  <text x="178" y="295" text-anchor="middle" class="sans small" fill="#0F7C83">A · B · C · D</text>

  <path d="M260 275H292" class="arrow"/>
  <rect x="302" y="224" width="214" height="294" rx="16" class="gate"/>
  <circle cx="330" cy="254" r="17" fill="#1557B0"/>
  <text x="330" y="260" text-anchor="middle" class="sans" font-size="16" font-weight="800" fill="#fff">1</text>
  <text x="409" y="302" text-anchor="middle" class="sans ink card-title">Metadata Filter</text>
  <text x="409" y="342" text-anchor="middle" class="sans muted card-copy">先确定资格范围</text>
  <text x="409" y="372" text-anchor="middle" class="sans muted card-copy">版本 · 来源角色</text>
  <rect x="330" y="398" width="158" height="54" rx="11" fill="#fff" stroke="#1557B0"/>
  <text x="409" y="431" text-anchor="middle" class="sans small" fill="#1557B0">保留 A · B · C</text>
  <text x="409" y="488" text-anchor="middle" class="sans small" fill="#C76B00">D：资格不符</text>

  <path d="M516 371H548" class="arrow"/>
  <rect x="558" y="224" width="214" height="294" rx="16" class="gate"/>
  <circle cx="586" cy="254" r="17" fill="#1557B0"/>
  <text x="586" y="260" text-anchor="middle" class="sans" font-size="16" font-weight="800" fill="#fff">2</text>
  <text x="665" y="302" text-anchor="middle" class="sans ink card-title">Route candidate_k</text>
  <text x="665" y="342" text-anchor="middle" class="sans muted card-copy">每条路线各自取前 k</text>
  <text x="665" y="372" text-anchor="middle" class="sans muted card-copy">不是最终结果数</text>
  <rect x="586" y="398" width="158" height="54" rx="11" fill="#fff" stroke="#1557B0"/>
  <text x="665" y="431" text-anchor="middle" class="sans small" fill="#1557B0">Lexical / Dense</text>
  <text x="665" y="488" text-anchor="middle" class="sans small" fill="#C76B00">路线外候选被截断</text>

  <path d="M772 371H804" class="arrow"/>
  <rect x="814" y="224" width="214" height="294" rx="16" class="gate"/>
  <circle cx="842" cy="254" r="17" fill="#1557B0"/>
  <text x="842" y="260" text-anchor="middle" class="sans" font-size="16" font-weight="800" fill="#fff">3</text>
  <text x="921" y="302" text-anchor="middle" class="sans ink card-title">Route threshold</text>
  <text x="921" y="342" text-anchor="middle" class="sans muted card-copy">在各自原生空间判断</text>
  <text x="921" y="372" text-anchor="middle" class="sans muted card-copy">保留原始分数与结论</text>
  <rect x="842" y="398" width="158" height="54" rx="11" fill="#fff" stroke="#1557B0"/>
  <text x="921" y="431" text-anchor="middle" class="sans small" fill="#1557B0">通过 A · B</text>
  <text x="921" y="488" text-anchor="middle" class="sans small" fill="#C76B00">C：低于路线阈值</text>

  <path d="M1028 371H1060" class="arrow"/>
  <rect x="1070" y="224" width="184" height="294" rx="16" class="fuse"/>
  <circle cx="1098" cy="254" r="17" fill="#5B45C6"/>
  <text x="1098" y="260" text-anchor="middle" class="sans" font-size="16" font-weight="800" fill="#fff">4</text>
  <text x="1162" y="302" text-anchor="middle" class="sans ink card-title">RRF</text>
  <text x="1162" y="342" text-anchor="middle" class="sans muted card-copy">只融合已通过记录</text>
  <text x="1162" y="372" text-anchor="middle" class="sans muted card-copy">按 chunk_id 汇合</text>
  <rect x="1094" y="398" width="136" height="54" rx="11" fill="#fff" stroke="#5B45C6"/>
  <text x="1162" y="431" text-anchor="middle" class="sans small" fill="#5B45C6">排序 A · B</text>
  <text x="1162" y="488" text-anchor="middle" class="sans small" fill="#C76B00">不重做资格判断</text>

  <path d="M1254 371H1286" class="arrow"/>
  <rect x="1296" y="224" width="208" height="294" rx="16" class="output"/>
  <circle cx="1324" cy="254" r="17" fill="#2C7A53"/>
  <text x="1324" y="260" text-anchor="middle" class="sans" font-size="16" font-weight="800" fill="#fff">5</text>
  <text x="1400" y="302" text-anchor="middle" class="sans ink card-title">final_top_k</text>
  <text x="1400" y="342" text-anchor="middle" class="sans muted card-copy">融合后统一截断</text>
  <text x="1400" y="372" text-anchor="middle" class="sans muted card-copy">形成最终名单</text>
  <rect x="1324" y="398" width="152" height="54" rx="11" fill="#fff" stroke="#2C7A53"/>
  <text x="1400" y="431" text-anchor="middle" class="sans small" fill="#2C7A53">返回 A</text>
  <text x="1400" y="488" text-anchor="middle" class="sans small" fill="#C76B00">B：最终名额不足</text>

  <rect x="96" y="560" width="1408" height="166" rx="16" fill="#F2FAFA" stroke="#B9DADB" stroke-width="1.5"/>
  <text x="124" y="599" class="sans band-title" fill="#0F7C83">RetrieverReport｜同时交付结果与过程</text>
  <text x="124" y="638" class="sans muted card-copy">每层输入数、输出数、原始分数、阈值决定、路线状态、配置身份与耗时。</text>
  <text x="124" y="674" class="sans muted card-copy">空名单必须说明：过滤后为空、阈值后为空、路线失败，还是最终截断；不能只返回空数组。</text>

  <rect x="64" y="792" width="1472" height="76" rx="18" fill="#FFF8EE" stroke="#E1B370" stroke-width="1.8"/>
  <circle cx="104" cy="830" r="20" fill="#C76B00"/>
  <text x="104" y="838" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#fff">!</text>
  <text x="144" y="838" class="sans ink takeaway">候选第一次消失在哪一层，就检查那一层；改变后续参数不能补回已经被前序控制移除的内容。</text>
</svg>
