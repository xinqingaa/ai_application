<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Embedding：在同一空间里比较语义方向</title>
  <desc id="desc">Query 与 Chunk 必须使用同一 Embedding 空间形成向量，再用明确的距离或相似度度量比较，输出相似候选和完整空间身份；相似不代表业务正确。</desc>
  <defs>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1557B0"/></marker>
    <marker id="arrow-data" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#0F7C83"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102A56}.muted{fill:#536986}.title{font-size:44px;font-weight:750;letter-spacing:-.6px}.claim{font-size:21px;font-weight:450}.band-title{font-size:22px;font-weight:700}.card-title{font-size:24px;font-weight:700}.card-copy{font-size:17px;font-weight:450}.small{font-size:16px;font-weight:550}.chip{font-size:16px;font-weight:700}.takeaway{font-size:24px;font-weight:700}.card{fill:#fff;stroke:#AFC3E3;stroke-width:2}.data{fill:#F2FAFA;stroke:#0F7C83;stroke-width:2.5}.model{fill:#F5F3FF;stroke:#5B45C6;stroke-width:2.5}.output{fill:#F4FAF6;stroke:#2C7A53;stroke-width:2.5}.arrow{fill:none;stroke:#1557B0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-primary)}.data-arrow{fill:none;stroke:#0F7C83;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-data)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text x="64" y="76" class="sans ink title">Embedding：在同一空间里比较语义方向</text>
  <text x="64" y="119" class="sans muted claim">Embedding 把文本变成可比较的向量；应用必须固定空间身份、度量方向和输入边界，才能解释分数。</text>
  <rect x="1328" y="48" width="208" height="48" rx="24" fill="#EAF1FC" stroke="#AFC3E3" stroke-width="1.5"/>
  <text x="1432" y="79" text-anchor="middle" class="sans ink chip">第 10 节 · 向量表示</text>

  <rect x="64" y="158" width="1472" height="610" rx="24" fill="#fff" stroke="#86A9D9" stroke-width="2.5"/>
  <text x="96" y="202" class="sans band-title" fill="#1557B0">表示与比较链</text>

  <rect x="96" y="238" width="250" height="146" rx="16" class="card"/>
  <text x="221" y="278" text-anchor="middle" class="sans ink card-title">Query</text>
  <text x="221" y="318" text-anchor="middle" class="sans muted card-copy">“怎样发起逆向服务？”</text>
  <text x="221" y="352" text-anchor="middle" class="sans small" fill="#1557B0">自然语言表达</text>
  <rect x="96" y="430" width="250" height="146" rx="16" class="card"/>
  <text x="221" y="470" text-anchor="middle" class="sans ink card-title">Chunk</text>
  <text x="221" y="510" text-anchor="middle" class="sans muted card-copy">“申请售后入口规则”</text>
  <text x="221" y="544" text-anchor="middle" class="sans small" fill="#0F7C83">知识文本</text>

  <path d="M346 311H404" class="arrow"/>
  <path d="M346 503H404" class="data-arrow"/>

  <rect x="414" y="260" width="294" height="294" rx="18" class="model"/>
  <text x="561" y="303" text-anchor="middle" class="sans ink card-title">同一 Embedding 空间</text>
  <text x="561" y="345" text-anchor="middle" class="sans muted card-copy">Provider + Model</text>
  <text x="561" y="377" text-anchor="middle" class="sans muted card-copy">维度 + 归一化策略</text>
  <line x1="450" y1="404" x2="672" y2="404" stroke="#D7D0FA" stroke-width="1.5"/>
  <text x="561" y="440" text-anchor="middle" class="sans small" fill="#5B45C6">Query 与 Chunk 禁止混用空间</text>
  <rect x="468" y="470" width="186" height="52" rx="26" fill="#fff" stroke="#5B45C6" stroke-width="1.5"/>
  <text x="561" y="503" text-anchor="middle" class="sans small" fill="#5B45C6">批量调用也遵守同一契约</text>

  <path d="M708 407H760" class="arrow"/>

  <rect x="770" y="238" width="316" height="338" rx="18" class="data"/>
  <text x="928" y="280" text-anchor="middle" class="sans ink card-title">向量与度量</text>
  <g transform="translate(808 315)">
    <line x1="0" y1="134" x2="226" y2="134" stroke="#AFC3E3" stroke-width="2"/>
    <line x1="30" y1="166" x2="30" y2="0" stroke="#AFC3E3" stroke-width="2"/>
    <path d="M30 134L178 42" stroke="#1557B0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="178" cy="42" r="7" fill="#1557B0"/>
    <path d="M30 134L190 74" stroke="#0F7C83" stroke-width="5" stroke-linecap="round"/>
    <circle cx="190" cy="74" r="7" fill="#0F7C83"/>
    <path d="M30 134L86 22" stroke="#C76B00" stroke-width="4" stroke-linecap="round"/>
    <circle cx="86" cy="22" r="6" fill="#C76B00"/>
  </g>
  <text x="928" y="523" text-anchor="middle" class="sans small" fill="#0F7C83">方向接近 → cosine 较高</text>
  <text x="928" y="551" text-anchor="middle" class="sans small" fill="#C76B00">度量名称与排序方向必须明确</text>

  <path d="M1086 407H1138" class="data-arrow"/>

  <rect x="1148" y="238" width="356" height="338" rx="18" class="output"/>
  <text x="1326" y="280" text-anchor="middle" class="sans ink card-title">相似候选与可解释事实</text>
  <rect x="1178" y="308" width="296" height="66" rx="12" fill="#fff" stroke="#2C7A53" stroke-width="1.5"/>
  <text x="1202" y="337" class="sans ink card-copy">1　售后入口规则</text>
  <text x="1450" y="360" text-anchor="end" class="sans small" fill="#2C7A53">similarity 0.86</text>
  <rect x="1178" y="388" width="296" height="66" rx="12" fill="#fff" stroke="#AFC3E3" stroke-width="1.5"/>
  <text x="1202" y="417" class="sans ink card-copy">2　订单状态约束</text>
  <text x="1450" y="440" text-anchor="end" class="sans small muted">similarity 0.78</text>
  <text x="1326" y="500" text-anchor="middle" class="sans small" fill="#2C7A53">保留原始向量、度量与空间身份</text>
  <text x="1326" y="533" text-anchor="middle" class="sans small" fill="#C76B00">暂不等于资料库检索</text>

  <rect x="96" y="618" width="1408" height="108" rx="16" fill="#F5F8FD" stroke="#C4D4EA" stroke-width="1.5"/>
  <text x="124" y="657" class="sans band-title" fill="#1557B0">失败边界</text>
  <text x="124" y="694" class="sans muted card-copy">空输入、维度不一致、模型空间变化与真实 Provider 故障必须分开；分数只能在同一空间、同一度量下比较。</text>

  <rect x="64" y="792" width="1472" height="76" rx="18" fill="#FFF8EE" stroke="#E1B370" stroke-width="1.8"/>
  <circle cx="104" cy="830" r="20" fill="#C76B00"/>
  <text x="104" y="838" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#fff">!</text>
  <text x="144" y="838" class="sans ink takeaway">向量相似只表示表示空间中的接近；它不证明业务正确、来源有效或结论得到支持。</text>
</svg>
