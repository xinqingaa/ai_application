<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">第 14 至 16 节向引文支持性校验交付的对象</title>
  <desc id="desc">第 14 节交付最终检索名单，第 15 节交付本轮 Context 与允许集合，第 16 节交付通过成员检查的来源声明。第 17 节继续判断引文是否存在以及内容是否支持。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1557B0"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102A56}.muted{fill:#536986}.stage{font-size:18px;font-weight:750}.name{font-size:28px;font-weight:750}.label{font-size:16px;font-weight:750}.copy{font-size:18px;font-weight:500}.handoff{font-size:21px;font-weight:700}.card{fill:#fff;stroke:#AFC3E3;stroke-width:2}.data{fill:#F2FAFA;stroke:#0F7C83;stroke-width:2.5}.model{fill:#F5F3FF;stroke:#5B45C6;stroke-width:2.5}.arrow{fill:none;stroke:#1557B0;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="640" fill="#F7F9FC"/>

  <rect x="64" y="64" width="420" height="400" rx="20" class="data"/>
  <rect x="88" y="88" width="100" height="36" rx="18" fill="#0F7C83"/>
  <text x="138" y="113" text-anchor="middle" class="sans stage" fill="#fff">第 14 节</text>
  <text x="88" y="172" class="sans ink name">最终检索名单</text>
  <text x="88" y="211" class="sans muted copy">Retriever 已完成过滤、融合与截断</text>
  <line x1="88" y1="244" x2="460" y2="244" stroke="#B9DADB" stroke-width="2"/>
  <text x="88" y="284" class="sans label" fill="#0F7C83">交付</text>
  <text x="88" y="318" class="sans ink copy">候选身份 + 同次运行诊断</text>
  <text x="88" y="374" class="sans label" fill="#C76B00">仍未回答</text>
  <text x="88" y="408" class="sans muted copy">模型这一轮真正看见哪些文字？</text>

  <path d="M484 264H550" class="arrow"/>

  <rect x="568" y="64" width="420" height="400" rx="20" class="data"/>
  <rect x="592" y="88" width="100" height="36" rx="18" fill="#0F7C83"/>
  <text x="642" y="113" text-anchor="middle" class="sans stage" fill="#fff">第 15 节</text>
  <text x="592" y="172" class="sans ink name">Context 与允许集合</text>
  <text x="592" y="211" class="sans muted copy">资格、去重和预算决定实际装入内容</text>
  <line x1="592" y1="244" x2="964" y2="244" stroke="#B9DADB" stroke-width="2"/>
  <text x="592" y="284" class="sans label" fill="#0F7C83">交付</text>
  <text x="592" y="318" class="sans ink copy">模型输入 + 可声明的来源身份</text>
  <text x="592" y="374" class="sans label" fill="#C76B00">仍未回答</text>
  <text x="592" y="408" class="sans muted copy">模型会生成什么，又会不会越界？</text>

  <path d="M988 264H1054" class="arrow"/>

  <rect x="1072" y="64" width="464" height="400" rx="20" class="model"/>
  <rect x="1096" y="88" width="100" height="36" rx="18" fill="#5B45C6"/>
  <text x="1146" y="113" text-anchor="middle" class="sans stage" fill="#fff">第 16 节</text>
  <text x="1096" y="172" class="sans ink name">结构化风险与成员检查</text>
  <text x="1096" y="211" class="sans muted copy">Schema 守结构，允许集合守来源编号</text>
  <line x1="1096" y1="244" x2="1512" y2="244" stroke="#CEC7F4" stroke-width="2"/>
  <text x="1096" y="284" class="sans label" fill="#5B45C6">交付</text>
  <text x="1096" y="318" class="sans ink copy">通过成员检查的候选来源声明</text>
  <text x="1096" y="374" class="sans label" fill="#C76B00">仍未回答</text>
  <text x="1096" y="408" class="sans muted copy">引文是否存在？内容是否支持？</text>

  <rect x="352" y="510" width="896" height="86" rx="18" fill="#FFF8EE" stroke="#C76B00" stroke-width="2"/>
  <text x="800" y="546" text-anchor="middle" class="sans label" fill="#C76B00">第 17 节接收的起点</text>
  <text x="800" y="578" text-anchor="middle" class="sans ink handoff">编号合法只确定“去哪里核对”，不能证明原话存在或结论成立</text>
</svg>
