<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">来源声明依次通过引文定位与语义支持判断</title>
  <desc id="desc">合法来源编号先进入确定性引文定位。找不到、缺失或位置不唯一时停止；唯一定位后保存原文位置，再由结构化模型读取完整语境，判断支持、反驳、无关或无法判断。只有支持形成已验证引用。</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1557B0"/></marker>
    <marker id="red-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#C43D3D"/></marker>
    <marker id="orange-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#C76B00"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102A56}.muted{fill:#536986}.step{font-size:18px;font-weight:750}.name{font-size:28px;font-weight:750}.copy{font-size:18px;font-weight:500}.small{font-size:16px;font-weight:650}.chip{font-size:17px;font-weight:750}.main{fill:none;stroke:#1557B0;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#blue-arrow)}.fail{fill:none;stroke:#C43D3D;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#red-arrow)}.caution{fill:none;stroke:#C76B00;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#orange-arrow)}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#F7F9FC"/>

  <rect x="52" y="214" width="238" height="250" rx="20" fill="#F2FAFA" stroke="#0F7C83" stroke-width="2.5"/>
  <text x="171" y="264" text-anchor="middle" class="sans small" fill="#0F7C83">上游已经确认</text>
  <text x="171" y="306" text-anchor="middle" class="sans name ink">来源编号合法</text>
  <rect x="84" y="342" width="174" height="54" rx="12" fill="#fff" stroke="#0F7C83"/>
  <text x="171" y="376" text-anchor="middle" class="sans small" fill="#0F7C83">B.chunk_id</text>
  <text x="171" y="432" text-anchor="middle" class="sans copy muted">只确定核对位置</text>

  <path d="M290 339H350" class="main"/>

  <rect x="366" y="78" width="390" height="430" rx="22" fill="#fff" stroke="#0F7C83" stroke-width="3"/>
  <rect x="394" y="104" width="132" height="38" rx="19" fill="#0F7C83"/>
  <text x="460" y="130" text-anchor="middle" class="sans step" fill="#fff">确定性程序</text>
  <text x="394" y="190" class="sans name ink">定位模型给出的原话</text>
  <text x="394" y="232" class="sans copy muted">只归一化 Unicode、换行和空白</text>
  <text x="394" y="264" class="sans copy muted">不做同义改写，不用相似搜索猜测</text>
  <rect x="394" y="304" width="334" height="90" rx="14" fill="#F2FAFA" stroke="#0F7C83" stroke-width="2"/>
  <text x="561" y="340" text-anchor="middle" class="sans chip" fill="#0F7C83">唯一定位</text>
  <text x="561" y="374" text-anchor="middle" class="sans copy ink">保存来源位置与字符范围</text>
  <text x="394" y="446" class="sans small" fill="#C76B00">到这里仍只证明“文字存在”</text>

  <path d="M756 293H824" class="main"/>

  <rect x="840" y="78" width="430" height="430" rx="22" fill="#F5F3FF" stroke="#5B45C6" stroke-width="3"/>
  <rect x="868" y="104" width="132" height="38" rx="19" fill="#5B45C6"/>
  <text x="934" y="130" text-anchor="middle" class="sans step" fill="#fff">结构化模型</text>
  <text x="868" y="190" class="sans name ink">读取完整语境判断关系</text>
  <text x="868" y="232" class="sans copy muted">Claim + 引文 + 来源全文 + Metadata</text>
  <text x="868" y="264" class="sans copy muted">检查版本、范围、条件、否定与反向规则</text>
  <rect x="868" y="310" width="166" height="58" rx="12" fill="#F4FAF6" stroke="#2C7A53"/>
  <text x="951" y="346" text-anchor="middle" class="sans chip" fill="#2C7A53">支持</text>
  <rect x="1050" y="310" width="166" height="58" rx="12" fill="#FFF1F1" stroke="#C43D3D"/>
  <text x="1133" y="346" text-anchor="middle" class="sans chip" fill="#C43D3D">反驳</text>
  <rect x="868" y="386" width="166" height="58" rx="12" fill="#FFF8EE" stroke="#C76B00"/>
  <text x="951" y="422" text-anchor="middle" class="sans chip" fill="#C76B00">无关</text>
  <rect x="1050" y="386" width="166" height="58" rx="12" fill="#F5F8FD" stroke="#7C91AE"/>
  <text x="1133" y="422" text-anchor="middle" class="sans chip" fill="#536986">无法判断</text>

  <path d="M1270 293H1322" class="main"/>
  <text x="1296" y="275" text-anchor="middle" class="sans small" fill="#2C7A53">只有支持</text>
  <rect x="1338" y="214" width="210" height="250" rx="20" fill="#F4FAF6" stroke="#2C7A53" stroke-width="2.5"/>
  <text x="1443" y="274" text-anchor="middle" class="sans small" fill="#2C7A53">形成</text>
  <text x="1443" y="318" text-anchor="middle" class="sans name ink">已验证引用</text>
  <text x="1443" y="366" text-anchor="middle" class="sans copy muted">身份 · 引文</text>
  <text x="1443" y="398" text-anchor="middle" class="sans copy muted">位置 · 支持理由</text>
  <text x="1443" y="438" text-anchor="middle" class="sans small" fill="#2C7A53">交给充分性判断</text>

  <path d="M561 508V558H350V588" class="fail"/>
  <rect x="116" y="600" width="468" height="112" rx="18" fill="#FFF1F1" stroke="#C43D3D" stroke-width="2"/>
  <text x="350" y="642" text-anchor="middle" class="sans chip" fill="#C43D3D">找不到 · 缺失 · 位置不唯一</text>
  <text x="350" y="678" text-anchor="middle" class="sans copy ink">保留定位结果，不让模型猜原话</text>

  <path d="M1055 508V558H1110V588" class="caution"/>
  <rect x="824" y="600" width="572" height="112" rx="18" fill="#FFF8EE" stroke="#C76B00" stroke-width="2"/>
  <text x="1110" y="642" text-anchor="middle" class="sans chip" fill="#C76B00">反驳 · 无关 · 无法判断</text>
  <text x="1110" y="678" text-anchor="middle" class="sans copy ink">保留关系和理由，但不接受为支持</text>
</svg>
