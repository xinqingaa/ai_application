[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-application-workspace"
version = "0.1.0"
description = "AI application learning workspace — editable packages under source/packages/"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core API / Streaming App
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    # LLM Client / Context Budgeting
    "openai>=1.59.0",
    "tiktoken>=0.8.0",
    # Prompt / Model Config
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
    "aiofiles>=25.1.0",
    # RAG Document Ingestion / Lexical Retrieval
    "python-docx>=1.2.0",
    "pypdf>=6.14.2",
    "markdown-it-py>=4.2.0",
    "psycopg[binary]>=3.2.0",
    "jieba>=0.42.1",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "reportlab>=5.0.0",
    "ruff>=0.8.4",
]

[tool.pytest.ini_options]
testpaths = [
    "source/packages",
    "review_assistant",
]
markers = [
    "integration: requires an explicitly configured real external dependency",
]
norecursedirs = [
    "archive",
    "other",
    ".venv",
]

[tool.setuptools.packages.find]
where = ["source/packages"]

[tool.setuptools.package-dir]
"" = "source/packages"

[tool.setuptools.package-data]
"llm_core.config" = ["models.yaml"]
"llm_core.prompts" = ["review/*.yaml"]
